const daysFromNowISO = days => new Date(Date.now() + days * 86400000).toISOString();
const minutesFromNowISO = mins => new Date(Date.now() + mins * 60000).toISOString();
const clamp = (n, min, max) => Math.min(max, Math.max(min, n));
const normalize = s => (s || '').toLocaleLowerCase('pl-PL').trim().replace(/[.,!?;:]/g,'').replace(/\s+/g,' ');
const escapeHtml = s => String(s ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));

function shuffled(items) { return [...items].sort(() => Math.random() - .5); }
function scoreToPct(correct,total){ return total ? Math.round(correct/total*100) : 0; }


// ---- scheduler.js ----
// SM-2-derived scheduler using four UI ratings mapped to SM-2 quality scores.
// Again=1, Hard=3, Good=4, Easy=5. Ease follows the published SM-2 update formula.
const RATING_QUALITY = { again: 1, hard: 3, good: 4, easy: 5 };

function newSchedule() {
  return { repetitions: 0, ease: 2.5, intervalDays: 0, due: new Date().toISOString(), lapses: 0, lastReview: null };
}

function scheduleReview(schedule, rating, at = new Date()) {
  const q = RATING_QUALITY[rating];
  if (!q) throw new Error(`Unknown rating: ${rating}`);
  let { repetitions=0, ease=2.5, intervalDays=0, lapses=0 } = schedule || newSchedule();
  const oldEase = ease;
  ease = clamp(ease + (0.1 - (5-q) * (0.08 + (5-q)*0.02)), 1.3, 3.0);

  let due;
  if (q < 3) {
    repetitions = 0;
    intervalDays = 0;
    lapses += 1;
    due = new Date(at.getTime() + 10 * 60000).toISOString();
  } else {
    repetitions += 1;
    if (repetitions === 1) intervalDays = rating === 'easy' ? 4 : 1;
    else if (repetitions === 2) intervalDays = rating === 'hard' ? 3 : rating === 'easy' ? 8 : 6;
    else {
      const modifier = rating === 'hard' ? 0.8 : rating === 'easy' ? 1.3 : 1;
      intervalDays = Math.max(1, Math.round(intervalDays * oldEase * modifier));
    }
    due = new Date(at.getTime() + intervalDays * 86400000).toISOString();
  }
  return { repetitions, ease: Number(ease.toFixed(3)), intervalDays, due, lapses, lastReview: at.toISOString() };
}

function isDue(schedule, at = new Date()) {
  return !schedule?.due || new Date(schedule.due) <= at;
}

function dueLabel(schedule) {
  const diff = new Date(schedule.due).getTime() - Date.now();
  if (diff <= 0) return 'Due now';
  const mins = Math.round(diff/60000);
  if (mins < 60) return `in ${mins} min`;
  const days = Math.round(diff/86400000);
  return days <= 1 ? 'tomorrow' : `in ${days} days`;
}

const STORES = ['profile','topics','vocab','cards','reviews','mistakes','activity','writing'];
let dbPromise;

function openDB(){
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      for (const s of STORES) if (!db.objectStoreNames.contains(s)) db.createObjectStore(s,{keyPath:'id'});
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

async function getAll(store){ const db=await openDB(); return new Promise((res,rej)=>{ const r=db.transaction(store).objectStore(store).getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function get(store,id){ const db=await openDB(); return new Promise((res,rej)=>{ const r=db.transaction(store).objectStore(store).get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function put(store,value){ const db=await openDB(); return new Promise((res,rej)=>{ const r=db.transaction(store,'readwrite').objectStore(store).put(value); r.onsuccess=()=>res(value); r.onerror=()=>rej(r.error); }); }
async function add(store,value){ return put(store,value); }
async function remove(store,id){ const db=await openDB(); return new Promise((res,rej)=>{ const r=db.transaction(store,'readwrite').objectStore(store).delete(id); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); }
async function clear(store){ const db=await openDB(); return new Promise((res,rej)=>{ const r=db.transaction(store,'readwrite').objectStore(store).clear(); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); }

async function seed(){
  if (!(await get('profile','me'))) await put('profile',{id:'me',name:'Learner',level:'A1',dailyMinutes:15,theme:'system',createdAt:nowISO()});
  if ((await getAll('topics')).length === 0) for (const t of DEFAULT_TOPICS) await put('topics',{...t,source:'manual starter',volume:'',lesson:'',notes:'',updatedAt:nowISO()});
  if ((await getAll('vocab')).length === 0) {
    for (const v of VOCAB) {
      await put('vocab',v);
      for (const direction of ['pl-en','en-pl']) await put('cards',{id:`${v.id}:${direction}`,vocabId:v.id,direction,schedule:newSchedule(),createdAt:nowISO()});
    }
  }
}

async function logActivity(data){ return put('activity',{id:uid('act'),at:nowISO(),...data}); }
async function logMistake(data){ return put('mistakes',{id:uid('mistake'),createdAt:nowISO(),timesSeen:1,resolved:false,...data}); }

async function exportData(){
  const out = {version:1, exportedAt:nowISO(), stores:{}};
  for (const s of STORES) out.stores[s]=await getAll(s);
  return out;
}
async function importData(data){
  if (!data?.stores) throw new Error('Invalid PolskiLab export');
  for (const s of STORES) {
    await clear(s);
    for (const item of (data.stores[s] || [])) await put(s,item);
  }
}


// ---- grammar.js ----
function evaluateExercise(exercise, input) {
  const n = normalize(input);
  const accepted = exercise.accepted.map(normalize);
  const exact = accepted.includes(n);
  if (exact) return { correct:true, status:'correct', message:'Correct.' };

  // Conservative partial matching only for explanation-style responses.
  if (exercise.type === 'explain' && n.includes('genitive') && n.includes('potrzeb')) {
    return {correct:true, status:'correct', message:'Correct reasoning.'};
  }
  return { correct:false, status:'incorrect', message:'Not quite.' };
}

function diacriticHint(input, answer) {
  const strip = s => normalize(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  return strip(input) === strip(answer) && normalize(input) !== normalize(answer)
    ? 'Your structure is right, but check the Polish diacritics.' : null;
}

function go(route){ state.route=route; shell(); window.scrollTo({top:0,behavior:'smooth'}); }

function titleBlock(eyebrow,title,sub=''){ return `<section class="hero"><div class="eyebrow">${escapeHtml(eyebrow)}</div><h1>${escapeHtml(title)}</h1>${sub?`<p>${escapeHtml(sub)}</p>`:''}</section>`; }
function toast(msg){

}

function dueCards(){ return state.cards.filter(c=>isDue(c.schedule)); }
function recentActivities(days=7){ const cutoff=Date.now()-days*86400000; return state.activity.filter(a=>new Date(a.at).getTime()>=cutoff); }
function studiedTopicIds(){ return state.topics.filter(t=>t.status!=='not_studied').map(t=>t.id); }
function topicName(id){ return state.topics.find(t=>t.id===id)?.title || id.replace('case-','').replaceAll('-',' '); }

function buildDailyPlan(minutes){
  const due=dueCards().length; const weak=weaknesses(); const studied=studiedTopicIds();
  const slots=Math.max(2,Math.round(minutes/4)); const tasks=[];
  if(due) tasks.push({type:'vocab',title:`Review ${Math.min(due,Math.max(3,slots*2))} due cards`,why:'Due retrieval gets priority because delayed recall is the core retention signal.'});
  if(weak.length) tasks.push({type:'grammar',topic:weak[0].id,title:`Repair: ${weak[0].label}`,why:'This concept has produced recent errors.'});
  const eligible=GRAMMAR_EXERCISES.filter(g=>g.topics.some(t=>studied.includes(t)));
  if(eligible.length) tasks.push({type:'grammar',title:'Mixed grammar retrieval',why:'Interleaves already encountered material instead of blocking one rule.'});
  if(minutes>=10) tasks.push({type:'reading',title:'Short reading / listening',why:'Adds comprehensible input and meaning-focused comprehension.'});
  if(minutes>=15) tasks.push({type:'conversation',title:'One practical exchange',why:'Ends with meaningful output rather than recognition only.'});
  if(minutes>=20 && weak[1]) tasks.push({type:'grammar',topic:weak[1].id,title:`Second repair: ${weak[1].label}`,why:'Extra time is used for demonstrated weaknesses, not filler.'});
  return tasks.slice(0,Math.max(2,slots));
}

function renderDaily(){
  const plan=state.dailyPlan||buildDailyPlan(state.dailyMinutes);
  view(`${titleBlock('Adaptive practice',`${state.dailyMinutes}-minute session`,'Do what fits today. Nothing here is required for a streak.')}
    <div class="grid"><section class="card full"><div class="row space"><div class="seg" id="dailyDurations">${[5,10,15,20,30].map(n=>`<button data-min="${n}" class="${n===state.dailyMinutes?'active':''}">${n} min</button>`).join('')}</div><button class="btn ghost" id="rebuild">Rebuild</button></div></section>
    ${plan.map((t,i)=>`<section class="card ${i===0?'wide':''}"><div class="kicker">${i+1} · ${escapeHtml(t.type)}</div><h2>${escapeHtml(t.title)}</h2><p class="muted small">${escapeHtml(t.why)}</p><button class="btn ${i===0?'primary':''}" data-task="${i}">Start</button></section>`).join('')}
    <section class="card full"><div class="notice"><strong>How adaptation works:</strong> due reviews first when present, then recurring mistakes, then interleaved encountered concepts. Longer sessions add input and output. There are no arbitrary fixed percentages.</div></section></div>`);
  document.querySelectorAll('#dailyDurations button').forEach(b=>b.onclick=()=>{state.dailyMinutes=Number(b.dataset.min);state.dailyPlan=buildDailyPlan(state.dailyMinutes);renderDaily();});
  document.querySelector('#rebuild').onclick=()=>{state.dailyPlan=buildDailyPlan(state.dailyMinutes);renderDaily();};
  document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{const t=plan[Number(b.dataset.task)]; if(t.type==='grammar'){state.grammarFilter=t.topic||'all';go('grammar')} else go(t.type);});
}

function availableGrammar(){
  let pool=[...GRAMMAR_EXERCISES];
  if(state.grammarFilter!=='all') pool=pool.filter(g=>g.topics.includes(state.grammarFilter));
  const studied=studiedTopicIds(); const matched=pool.filter(g=>g.topics.some(t=>studied.includes(t)));
  return matched.length?matched:pool;
}

function renderGrammar(){
  const pool=availableGrammar(); if(state.grammarIndex>=pool.length) state.grammarIndex=0; const ex=pool[state.grammarIndex];
  const filters=['all',...new Set(GRAMMAR_EXERCISES.flatMap(g=>g.topics))];
  view(`${titleBlock('Grammar laboratory','Retrieve, diagnose, retry.','Deterministic answer checking is conservative: known valid variants are accepted; stylistic rewrites are not forced.')}
    <div class="grid"><section class="card full"><div class="row space"><div class="seg" id="grammarFilters">${filters.map(f=>`<button data-filter="${f}" class="${state.grammarFilter===f?'active':''}">${f==='all'?'Mixed':escapeHtml(topicName(f))}</button>`).join('')}</div><span class="pill">${escapeHtml(ex.type)}</span></div></section>
    <section class="card full exercise"><div class="kicker">${escapeHtml(ex.level)} · ${escapeHtml(ex.topics.map(topicName).join(' + '))}</div><div class="prompt">${escapeHtml(ex.prompt)}</div>
      <div class="field"><input id="grammarInput" autocomplete="off" autocapitalize="sentences" placeholder="Type your answer in Polish…"></div><div class="row" style="margin-top:10px"><button class="btn primary" id="checkGrammar">Check</button><button class="btn" id="hintGrammar">Hint</button><button class="btn ghost" id="skipGrammar">Another example</button></div><div id="grammarFeedback" style="margin-top:14px"></div></section></div>`);
  document.querySelectorAll('#grammarFilters button').forEach(b=>b.onclick=()=>{state.grammarFilter=b.dataset.filter;state.grammarIndex=0;renderGrammar();});
  const input=document.querySelector('#grammarInput'); input.onkeydown=e=>{if(e.key==='Enter')checkGrammar(ex,input.value)};
  document.querySelector('#checkGrammar').onclick=()=>checkGrammar(ex,input.value);
  document.querySelector('#hintGrammar').onclick=()=>{document.querySelector('#grammarFeedback').innerHTML=`<div class="feedback">💡 ${escapeHtml(ex.hint)}</div>`};
  document.querySelector('#skipGrammar').onclick=()=>{state.grammarIndex=(state.grammarIndex+1)%pool.length;renderGrammar();};
}

async function checkGrammar(ex,input){
  if(!input.trim()) return; const result=evaluateExercise(ex,input); const dHint=diacriticHint(input,ex.accepted[0]);
  const fb=document.querySelector('#grammarFeedback');
  if(result.correct){
    fb.innerHTML=`<div class="feedback good"><strong>Correct.</strong><div>${escapeHtml(ex.explanation)}</div></div><div class="row" style="margin-top:10px"><button class="btn" id="nextGrammar">Next question</button><button class="btn ghost" id="whyGrammar">Why is this correct?</button></div>`;
    await logActivity({type:'grammar',exerciseId:ex.id,concepts:ex.topics,correct:true,mode:ex.type}); await refresh();
    document.querySelector('#nextGrammar').onclick=()=>{state.grammarIndex=(state.grammarIndex+1)%availableGrammar().length;renderGrammar()};
    document.querySelector('#whyGrammar').onclick=()=>toast(ex.explanation);
  } else {
    const clue=dHint?`<div><strong>Close:</strong> ${escapeHtml(dHint)}</div>`:'';
    fb.innerHTML=`<div class="feedback bad"><strong>Not quite.</strong>${clue}<div style="margin-top:6px">Correct answer: <strong>${escapeHtml(ex.answer)}</strong></div><div class="small muted" style="margin-top:7px">${escapeHtml(ex.explanation)}</div></div><div class="row" style="margin-top:10px"><button class="btn primary" id="retryGrammar">Retry from memory</button><button class="btn" id="whyWrong">Why is this wrong?</button></div>`;
    await logMistake({concept:ex.topics[0],concepts:ex.topics,exerciseType:ex.type,prompt:ex.prompt,userAnswer:input,correctAnswer:ex.answer,explanation:ex.explanation});
    await logActivity({type:'grammar',exerciseId:ex.id,concepts:ex.topics,correct:false,mode:ex.type}); await refresh();
    document.querySelector('#retryGrammar').onclick=()=>{document.querySelector('#grammarInput').value='';document.querySelector('#grammarInput').focus();fb.innerHTML=''};
    document.querySelector('#whyWrong').onclick=()=>{fb.querySelector('.feedback').innerHTML+=`<div class="notice" style="margin-top:10px">${escapeHtml(ex.explanation)}</div>`};
  }
}

function buildVocabQueue(){
  const due=state.cards.filter(c=>isDue(c.schedule));
  state.vocabQueue=(due.length?due:state.cards.slice(0,10)).sort((a,b)=>new Date(a.schedule.due)-new Date(b.schedule.due)); state.vocabPos=0; state.revealCard=false;
}

function renderVocab(){
  if(!state.vocabQueue.length) buildVocabQueue(); if(state.vocabPos>=state.vocabQueue.length) state.vocabPos=0;
  const card=state.vocabQueue[state.vocabPos]; const item=card&&state.vocab.find(v=>v.id===card.vocabId);
  if(!card||!item){ view(titleBlock('Vocabulary','No cards yet','Add a vocabulary item below.')); return; }
  const production=card.direction==='en-pl'; const front=production?item.meaning:item.lemma; const answer=production?item.lemma:item.meaning;
  const dueCount=dueCards().length;
  view(`${titleBlock('Spaced retrieval','Vocabulary & reviews',`${dueCount} card${dueCount===1?'':'s'} due. Production and recognition have separate schedules.`)}
  <div class="grid"><section class="card wide"><div class="row space"><span class="pill">${production?'English → Polish · production':'Polish → English · recognition'}</span><span class="small muted">${state.vocabPos+1} / ${state.vocabQueue.length}</span></div>
    <div class="flashcard"><div><div class="kicker">${production?'Produce the Polish lemma':'Recall the meaning'}</div><div class="flash-main">${escapeHtml(front)}</div>${state.revealCard?`<div class="flash-sub"><strong>${escapeHtml(answer)}</strong><br>${escapeHtml(item.gender)} · ${escapeHtml(item.forms)}<br><em>${escapeHtml(item.example)}</em></div>`:''}</div></div>
    ${state.revealCard?`<div class="rating" style="margin-top:12px">${['again','hard','good','easy'].map(r=>`<button data-rating="${r}">${r[0].toUpperCase()+r.slice(1)}</button>`).join('')}</div>`:`<div class="field" style="margin-top:12px"><input id="vocabInput" placeholder="Type your recall before revealing…" autocomplete="off"></div><div class="row" style="margin-top:10px"><button class="btn primary" id="revealCard">Reveal answer</button></div>`}
  </section><section class="card"><h2>Card details</h2><div class="list"><div class="list-item"><span class="muted small">Dictionary form</span><br><strong>${escapeHtml(item.lemma)}</strong></div><div class="list-item"><span class="muted small">Gender / class</span><br>${escapeHtml(item.gender)}</div><div class="list-item"><span class="muted small">Relevant forms</span><br>${escapeHtml(item.forms)}</div><div class="list-item"><span class="muted small">Next due</span><br>${escapeHtml(dueLabel(card.schedule))}</div></div></section>
  <section class="card full"><h2>Add your own vocabulary</h2><div class="topic-row"><input id="newLemma" placeholder="Polish dictionary form"><input id="newMeaning" placeholder="English meaning"><input id="newGender" placeholder="gender / verb"><input id="newForms" placeholder="relevant inflections"><button class="btn" id="addVocab">Add</button></div></section></div>`);
  if(!state.revealCard){
    const input=document.querySelector('#vocabInput'); input.onkeydown=e=>{if(e.key==='Enter') revealVocab(input.value)}; document.querySelector('#revealCard').onclick=()=>revealVocab(input.value);
  } else document.querySelectorAll('[data-rating]').forEach(b=>b.onclick=()=>rateVocab(card,b.dataset.rating));
  document.querySelector('#addVocab').onclick=addVocab;
}

async function revealVocab(input){ state.currentInput=input; state.revealCard=true; renderVocab(); }
async function rateVocab(card,rating){
  const item=state.vocab.find(v=>v.id===card.vocabId); const production=card.direction==='en-pl';
  const expected=production?item.lemma:item.meaning.split('/')[0].trim(); const selfCorrect=normalize(state.currentInput)===normalize(expected);
  const previous={...card.schedule}; card.schedule=scheduleReview(card.schedule,rating); await put('cards',card);
  await put('reviews',{id:uid('rev'),cardId:card.id,vocabId:item.id,direction:card.direction,rating,reviewedAt:nowISO(),previousDue:previous.due,nextDue:card.schedule.due,typedAnswer:state.currentInput});
  await logActivity({type:'vocab',vocabId:item.id,mode:production?'production':'recognition',correct:rating!=='again',typedExact:selfCorrect});
  if(rating==='again') await logMistake({concept:`vocab:${item.id}`,exerciseType:production?'production':'recognition',prompt:production?item.meaning:item.lemma,userAnswer:state.currentInput,correctAnswer:expected,explanation:`Review the lemma and its context: ${item.example}`});
  await refresh(); state.vocabPos+=1; state.revealCard=false;state.currentInput=''; if(state.vocabPos>=state.vocabQueue.length) buildVocabQueue(); renderVocab();
}

async function addVocab(){
  const lemma=document.querySelector('#newLemma').value.trim(), meaning=document.querySelector('#newMeaning').value.trim(); if(!lemma||!meaning)return toast('Add both lemma and meaning.');
  const id=uid('v'); const v={id,lemma,meaning,gender:document.querySelector('#newGender').value.trim()||'unspecified',forms:document.querySelector('#newForms').value.trim()||'—',example:'',tags:['manual']};
  await put('vocab',v); for(const direction of ['pl-en','en-pl'])await put('cards',{id:`${id}:${direction}`,vocabId:id,direction,schedule:newSchedule(),createdAt:nowISO()}); await refresh(); buildVocabQueue();renderVocab();
}

function renderConversation(){
  const sc=CONVERSATION_SCENARIOS.find(s=>s.id===state.conversation.scenario); const c=state.conversation;
  if(!c.messages.length) c.messages=[{from:'npc',text:sc.turns[0].npc}]; const turn=sc.turns[Math.min(c.turn,sc.turns.length-1)]; const done=c.turn>=sc.turns.length;
  view(`${titleBlock('Meaningful output','Conversation practice','Corrections are delayed until the exchange ends so fluency is not interrupted.')}
    <div class="grid"><section class="card full"><div class="row space"><div class="seg" id="convMode">${['guided','standard','immersion'].map(m=>`<button data-mode="${m}" class="${c.mode===m?'active':''}">${m}</button>`).join('')}</div><span class="pill">A1 · Restaurant</span></div></section>
    <section class="card wide"><div class="conversation">${c.messages.map(m=>`<div class="bubble ${m.from==='user'?'user':''}">${escapeHtml(m.text)}</div>`).join('')}</div>
      ${done?`<div class="feedback good" style="margin-top:14px"><strong>Exchange complete.</strong><div class="small">${conversationFeedback(sc,c.responses)}</div></div><button class="btn" id="restartConv" style="margin-top:10px">Try again</button>`:`${c.mode==='guided'?`<div class="row" style="margin-top:14px">${turn.suggestions.map(s=>`<button class="btn ghost suggestion">${escapeHtml(s)}</button>`).join('')}</div>`:''}<div class="field" style="margin-top:12px"><input id="convInput" placeholder="Reply in Polish…"></div><button class="btn primary" id="sendConv" style="margin-top:10px">Send</button>`}
    </section><section class="card"><h2>Mode</h2><p class="muted small">Guided shows response support. Standard keeps hints optional. Immersion keeps the exchange Polish-only.</p>${c.mode!=='immersion'&&!done?`<button class="btn" id="convHint">Hint</button><div id="convHintBox" class="small muted" style="margin-top:8px"></div>`:''}</section></div>`);
  document.querySelectorAll('#convMode button').forEach(b=>b.onclick=()=>{c.mode=b.dataset.mode;renderConversation()});
  if(done){document.querySelector('#restartConv').onclick=()=>{state.conversation={scenario:'restaurant',mode:c.mode,turn:0,messages:[],responses:[]};renderConversation()};return;}
  document.querySelectorAll('.suggestion').forEach(b=>b.onclick=()=>{document.querySelector('#convInput').value=b.textContent;document.querySelector('#convInput').focus()});
  const input=document.querySelector('#convInput'); input.onkeydown=e=>{if(e.key==='Enter')sendConversation(sc,input.value)}; document.querySelector('#sendConv').onclick=()=>sendConversation(sc,input.value);
  const hint=document.querySelector('#convHint'); if(hint)hint.onclick=()=>document.querySelector('#convHintBox').textContent=`Useful language: ${turn.suggestions.join(' / ')}`;
}

async function sendConversation(sc,text){
  if(!text.trim())return; const c=state.conversation; const turn=sc.turns[c.turn]; c.responses.push(text.trim()); c.messages.push({from:'user',text:text.trim()}); c.turn+=1;
  const match=turn.keywords.some(k=>normalize(text).includes(normalize(k))); await logActivity({type:'conversation',scenario:sc.id,turn:c.turn,correct:match});
  if(c.turn<sc.turns.length)c.messages.push({from:'npc',text:sc.turns[c.turn].npc}); await refresh();renderConversation();
}
function conversationFeedback(sc,responses){
  const misses=responses.map((r,i)=>({r,i,ok:sc.turns[i]?.keywords.some(k=>normalize(r).includes(normalize(k)))})).filter(x=>!x.ok);
  if(!misses.length)return 'Your responses used the expected communicative language for this scripted scenario. This is a limited local check, not a full grammatical evaluation.';
  return `The local checker could not confidently validate ${misses.length} response${misses.length===1?'':'s'}. That does not automatically mean they were wrong; without an AI or full parser, open-ended Polish is intentionally judged conservatively.`;
}

function tokenize(text){ return text.split(/(\s+|[.,!?])/).map(tok=>{const key=normalize(tok);return LEXICON[key]?`<button class="word" data-word="${escapeHtml(key)}">${escapeHtml(tok)}</button>`:escapeHtml(tok)}).join(''); }
function renderReading(){
  const r=READINGS[state.readingIndex%READINGS.length];
  view(`${titleBlock('Comprehensible input','Reading & listening','Listen before revealing the transcript, or read and inspect selected words in context.')}
  <div class="grid"><section class="card wide"><div class="row space"><span class="pill">${escapeHtml(r.level)}</span><div class="row"><button class="btn" id="speakNormal">▶ Normal</button><button class="btn" id="speakSlow">▶ Slow</button></div></div><h2>${escapeHtml(r.title)}</h2><div id="transcript" class="prompt" hidden>${tokenize(r.text)}</div><button class="btn primary" id="showTranscript">Reveal transcript</button><div id="wordInfo" class="notice" style="margin-top:12px">Click an underlined word after revealing the transcript.</div></section>
  <section class="card"><h2>Comprehension</h2><div class="stack">${r.questions.map((q,i)=>`<div class="field"><label>${i+1}. ${escapeHtml(q.q)}</label><input data-rq="${i}"><div id="rqf${i}" class="small"></div></div>`).join('')}<button class="btn" id="checkReading">Check understanding</button></div></section>
  <section class="card full"><button class="btn ghost" id="nextReading">Another passage</button><div class="notice" style="margin-top:10px">Audio uses your browser/device Polish text-to-speech voice. It is for listening input only; PolskiLab does not claim synthetic speech can assess pronunciation.</div></section></div>`);
  document.querySelector('#showTranscript').onclick=()=>{document.querySelector('#transcript').hidden=false;document.querySelector('#showTranscript').hidden=true;bindWords()};
  document.querySelector('#speakNormal').onclick=()=>speakPolish(r.text,.95); document.querySelector('#speakSlow').onclick=()=>speakPolish(r.text,.67);
  document.querySelector('#checkReading').onclick=async()=>{for(let i=0;i<r.questions.length;i++){const inp=document.querySelector(`[data-rq="${i}"]`);const ok=r.questions[i].accepted.map(normalize).includes(normalize(inp.value));document.querySelector(`#rqf${i}`).textContent=ok?'Correct.':`Answer: ${r.questions[i].answer}`;document.querySelector(`#rqf${i}`).className=`small ${ok?'':'danger'}`;await logActivity({type:'reading',passageId:r.id,question:i,correct:ok})}await refresh()};
  document.querySelector('#nextReading').onclick=()=>{state.readingIndex=(state.readingIndex+1)%READINGS.length;renderReading()};
}
function bindWords(){document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{const [lemma,meaning,role]=LEXICON[b.dataset.word];document.querySelector('#wordInfo').innerHTML=`<strong>${escapeHtml(b.textContent)}</strong> → <strong>${escapeHtml(lemma)}</strong> · ${escapeHtml(meaning)}<br><span class="small">${escapeHtml(role)}</span>`})}
function speakPolish(text,rate){ if(!('speechSynthesis'in window))return toast('Speech synthesis is not supported in this browser.');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='pl-PL';u.rate=rate;const voice=speechSynthesis.getVoices().find(v=>v.lang?.toLowerCase().startsWith('pl'));if(voice)u.voice=voice;speechSynthesis.speak(u); }

function renderWriting(){
  const prompts=['Describe your morning in 5–7 sentences.','Write a short message to a friend about your weekend.','Give your opinion: Is living in a big city better than a small town?'];
  view(`${titleBlock('Deliberate output','Writing workshop','Draft locally. The free baseline saves your work and runs transparent surface checks; deep four-category language feedback needs an optional AI service.')}
  <div class="grid"><section class="card wide"><div class="field"><label>Task</label><select id="writePrompt">${prompts.map(p=>`<option>${escapeHtml(p)}</option>`).join('')}</select></div><div class="field" style="margin-top:10px"><label>Your Polish</label><textarea id="writeText" placeholder="Napisz tutaj…"></textarea></div><div class="row"><button class="btn primary" id="saveWriting">Save draft</button><button class="btn" id="localWritingFeedback">Run free local checks</button></div><div id="writeFeedback" style="margin-top:12px"></div></section>
  <section class="card"><h2>Feedback capability</h2><div class="list"><div class="list-item"><strong>Free, local</strong><br><span class="small muted">Saving, length, sentence boundaries, obvious spacing, diacritic presence, recurring-error prompts.</span></div><div class="list-item"><strong>Optional AI</strong><br><span class="small muted">Grammar, vocabulary choice, naturalness and clarity across open-ended writing. No API key is embedded.</span></div></div></section>
  <section class="card full"><h2>Saved drafts</h2>${state.writing.length?`<div class="list">${state.writing.slice(-5).reverse().map(w=>`<div class="list-item"><strong>${escapeHtml(w.prompt)}</strong><div class="small muted">${new Date(w.createdAt).toLocaleString()} · ${w.text.split(/\s+/).filter(Boolean).length} words</div></div>`).join('')}</div>`:'<p class="muted small">No drafts saved yet.</p>'}</section></div>`);
  document.querySelector('#saveWriting').onclick=async()=>{const text=document.querySelector('#writeText').value.trim();if(!text)return;await put('writing',{id:uid('write'),prompt:document.querySelector('#writePrompt').value,text,createdAt:nowISO()});await logActivity({type:'writing',wordCount:text.split(/\s+/).filter(Boolean).length});await refresh();toast('Draft saved locally.');renderWriting()};
  document.querySelector('#localWritingFeedback').onclick=()=>{const t=document.querySelector('#writeText').value.trim(); const msgs=[]; if(t.length<30)msgs.push('Write a little more before evaluating the piece.');if(t&&!/[.!?]$/.test(t))msgs.push('Your final sentence may be missing end punctuation.');if(/\s{2,}/.test(t))msgs.push('There are repeated spaces to clean up.');if(t&&!/[ąćęłńóśźż]/i.test(t))msgs.push('No Polish diacritics appear. That can be valid, but check whether any are missing.');if(!msgs.length)msgs.push('No simple surface issues detected. This local check cannot reliably judge Polish grammar or naturalness.');document.querySelector('#writeFeedback').innerHTML=`<div class="feedback">${msgs.map(m=>`<div>• ${escapeHtml(m)}</div>`).join('')}</div>`};
}

function weaknesses(){
  const map=new Map(); for(const m of state.mistakes.filter(m=>!m.resolved)){const id=m.concept||m.concepts?.[0]||'other'; const cur=map.get(id)||{id,label:id.startsWith('vocab:')?(state.vocab.find(v=>v.id===id.split(':')[1])?.lemma||'Vocabulary item'):topicName(id),count:0};cur.count++;map.set(id,cur)} return [...map.values()].sort((a,b)=>b.count-a.count);
}
function renderProgress(){
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));const acts=state.activity.filter(a=>new Date(a.at).toDateString()===d.toDateString());return {label:d.toLocaleDateString('en',{weekday:'short'}),count:acts.length}}); const max=Math.max(1,...days.map(d=>d.count));
  const prod=state.activity.filter(a=>a.type==='vocab'&&a.mode==='production');const rec=state.activity.filter(a=>a.type==='vocab'&&a.mode==='recognition');
  view(`${titleBlock('Evidence, not XP','Progress','These are practice signals, not an official CEFR qualification or proof of proficiency.')}
  <div class="grid"><section class="card"><div class="kicker">Production reviews</div><div class="metric">${prod.length}</div><p class="small muted">English → Polish</p></section><section class="card"><div class="kicker">Recognition reviews</div><div class="metric">${rec.length}</div><p class="small muted">Polish → English</p></section><section class="card"><div class="kicker">Delayed reviews logged</div><div class="metric">${state.reviews.length}</div><p class="small muted">Each includes its next scheduled date.</p></section>
  <section class="card wide"><h2>Practice activity · 7 days</h2><div class="chart-bars">${days.map(d=>`<div class="bar" title="${d.label}: ${d.count}" style="height:${Math.max(3,d.count/max*100)}%"></div>`).join('')}</div><div class="row space small muted">${days.map(d=>`<span>${d.label}</span>`).join('')}</div></section>
  <section class="card"><h2>Weaknesses</h2>${weaknesses().length?weaknesses().slice(0,6).map(w=>`<div class="list-item" style="margin-bottom:7px"><strong>${escapeHtml(w.label)}</strong><div class="small muted">${w.count} errors</div></div>`).join(''):'<p class="muted small">No error history yet.</p>'}</section>
  <section class="card full"><h2>Interpret carefully</h2><p class="muted">Accuracy can rise because exercises become familiar; completion alone does not establish broad proficiency. PolskiLab therefore separates production from recognition and keeps mistakes visible for later retrieval.</p></section></div>`);
}

function renderTextbook(){
  view(`${titleBlock('Polski, krok po kroku','Textbook companion','Enter what you actually covered. PolskiLab does not assume or reproduce the book’s chapter syllabus.')}
  <div class="grid"><section class="card full"><h2>Add a studied objective</h2><div class="topic-row"><input id="topicTitle" placeholder="e.g. Genitive after szukać"><select id="topicCategory"><option>Grammar</option><option>Vocabulary</option><option>Communication</option></select><input id="topicVolume" placeholder="Volume (optional)"><input id="topicLesson" placeholder="Lesson/chapter (optional)"><button class="btn primary" id="addTopic">Add</button></div><div class="field" style="margin-top:10px"><textarea id="topicNotes" placeholder="Your notes, examples, or learning objectives. Do not paste copyrighted textbook pages."></textarea></div></section>
  <section class="card full"><h2>Your concept record</h2><div class="stack">${state.topics.map(t=>`<div class="list-item topic-row" data-topic="${t.id}"><div><strong>${escapeHtml(t.title)}</strong><div class="small muted">${escapeHtml(t.category)}${t.volume?` · Vol. ${escapeHtml(t.volume)}`:''}${t.lesson?` · ${escapeHtml(t.lesson)}`:''}</div></div><select data-status="${t.id}"><option value="not_studied" ${t.status==='not_studied'?'selected':''}>Not yet</option><option value="in_progress" ${t.status==='in_progress'?'selected':''}>In progress</option><option value="studied" ${t.status==='studied'?'selected':''}>Studied</option></select><span class="small muted">${escapeHtml(t.notes||'No notes')}</span><span class="small muted">${escapeHtml(t.source||'manual')}</span><button class="btn ghost danger" data-delete-topic="${t.id}">Remove</button></div>`).join('')}</div></section></div>`);
  document.querySelector('#addTopic').onclick=async()=>{const title=document.querySelector('#topicTitle').value.trim();if(!title)return;const id=uid('topic');await put('topics',{id,title,category:document.querySelector('#topicCategory').value,status:'in_progress',volume:document.querySelector('#topicVolume').value.trim(),lesson:document.querySelector('#topicLesson').value.trim(),notes:document.querySelector('#topicNotes').value.trim(),source:'manual',updatedAt:nowISO()});await refresh();renderTextbook()};
  document.querySelectorAll('[data-status]').forEach(s=>s.onchange=async()=>{const t=state.topics.find(x=>x.id===s.dataset.status);t.status=s.value;t.updatedAt=nowISO();await put('topics',t);await refresh();toast('Topic status saved.')});
  document.querySelectorAll('[data-delete-topic]').forEach(b=>b.onclick=async()=>{if(confirm('Remove this topic from your concept record?')){await remove('topics',b.dataset.deleteTopic);await refresh();renderTextbook()}});
}

function showDataDialog(){
  const modal=document.createElement('div');Object.assign(modal.style,{position:'fixed',inset:0,background:'rgba(0,0,0,.5)',zIndex:80,display:'grid',placeItems:'center',padding:'20px'});modal.innerHTML=`<div class="card" style="max-width:520px;width:100%;grid-column:auto"><h2>Your data</h2><p class="muted">Export a JSON backup or import one. Import replaces the current local dataset.</p><div class="row"><button class="btn primary" id="exportBtn">Export JSON</button><button class="btn" id="importBtn">Import JSON</button><button class="btn ghost" id="closeData">Close</button></div></div>`;document.body.appendChild(modal);
  modal.querySelector('#closeData').onclick=()=>modal.remove();modal.onclick=e=>{if(e.target===modal)modal.remove()};
  modal.querySelector('#exportBtn').onclick=async()=>{const data=await exportData();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`polskilab-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url)};
  modal.querySelector('#importBtn').onclick=()=>{modal.remove();document.querySelector('#importFile').click()};
}
async function handleImport(e){const file=e.target.files?.[0];if(!file)return;if(!confirm('Importing will replace your current local PolskiLab data. Continue?'))return;try{const data=JSON.parse(await file.text());await importData(data);await refresh();shell();toast('Backup imported.')}catch(err){alert(`Import failed: ${err.message}`)}finally{e.target.value=''}}

async function init(){
  await seed();await refresh();const theme=state.profile?.theme||'system';document.documentElement.dataset.theme=theme==='system'?'':theme;shell();
  if('serviceWorker'in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

init().catch(err=>{document.querySelector('#app').innerHTML=`<main class="main"><div class="feedback bad"><strong>PolskiLab could not start.</strong><pre>${escapeHtml(err.stack||err.message)}</pre></div></main>`});

  </script>
</body>
