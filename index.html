g:-.025em}.metric{font-size:2rem;font-weight:800;letter-spacing:-.04em}.muted{color:var(--muted)}.small{font-size:.86rem}.pill{display:inline-flex;border-radius:999px;padding:5px 9px;background:var(--panel2);color:var(--muted);font-size:.78rem}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.stack{display:grid;gap:12px}.field{display:grid;gap:6px}.field label{font-size:.84rem;color:var(--muted)}input,textarea,select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px 12px;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{min-height:110px;resize:vertical}.progress{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}.progress>span{display:block;height:100%;background:var(--accent)}.list{display:grid;gap:8px}.list-item{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg)}.exercise{max-width:760px;margin:18px auto}.prompt{font-size:1.35rem;line-height:1.45;margin:18px 0}.feedback{padding:12px;border-radius:12px;background:var(--panel2);line-height:1.5}.feedback.good{border-left:4px solid var(--good)}.feedback.bad{border-left:4px solid var(--accent)}.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button.active{background:var(--text);color:var(--bg)}.rating{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.rating button{padding:12px 8px}.flashcard{min-height:270px;display:grid;place-items:center;text-align:center;padding:28px;border-radius:18px;background:linear-gradient(145deg,var(--panel),var(--panel2));border:1px solid var(--line)}.flash-main{font-size:2rem;font-weight:750;letter-spacing:-.03em}.flash-sub{color:var(--muted);margin-top:8px}.kicker{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.topic-row{display:grid;grid-template-columns:1.3fr .8fr .8fr 1fr auto;gap:8px;align-items:center}.chart-bars{display:flex;align-items:end;gap:7px; /* ---- PolskiLab visual refresh ---- */
:root{
  --bg:#f7f5f2;--panel:#fffdfb;--panel2:#f1eeea;--text:#171719;--muted:#747075;--line:#e7e1dc;
  --accent:#d52b35;--accent2:#a81924;--good:#18865a;--warn:#b46f14;
  --shadow:0 18px 55px rgba(61,42,35,.08),0 2px 8px rgba(61,42,35,.05);
  --shadow-soft:0 8px 28px rgba(61,42,35,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1012;--panel:#18191c;--panel2:#222328;--text:#f7f5f2;--muted:#a9a6aa;--line:#2d2f34;--accent:#ff5b64;--accent2:#ff8990;--good:#55cf99;--warn:#efb461;--shadow:0 18px 55px rgba(0,0,0,.28);--shadow-soft:0 8px 28px rgba(0,0,0,.2)}}
:root[data-theme="dark"]{--bg:#0f1012;--panel:#18191c;--panel2:#222328;--text:#f7f5f2;--muted:#a9a6aa;--line:#2d2f34;--accent:#ff5b64;--accent2:#ff8990;--good:#55cf99;--warn:#efb461;--shadow:0 18px 55px rgba(0,0,0,.28);--shadow-soft:0 8px 28px rgba(0,0,0,.2)}
html{background:var(--bg)}
body{background:
  radial-gradient(900px 520px at 85% -10%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 65%),
  radial-gradient(700px 420px at -10% 15%,rgba(255,255,255,.65),transparent 65%),var(--bg);}
.topbar{height:70px;padding:0 24px;border-bottom:1px solid color-mix(in srgb,var(--line) 82%,transparent);background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(24px) saturate(150%)}
.brand{font-size:1.03rem;gap:11px}.brand-mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#fff 0 47%,var(--accent) 48% 100%);box-shadow:0 5px 14px rgba(213,43,53,.22),inset 0 0 0 1px rgba(0,0,0,.08);transform:rotate(-2deg)}
.icon-btn,.btn,.seg button,.rating button{border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 96%,transparent);border-radius:14px;padding:11px 14px;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease,background .16s ease}
.btn:hover,.icon-btn:hover,.seg button:hover,.rating button:hover{transform:translateY(-1px);box-shadow:var(--shadow-soft)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 24%,transparent);font-weight:760}
.layout{max-width:1320px;grid-template-columns:230px minmax(0,1fr)}
.sidebar{top:70px;height:calc(100vh - 70px);padding:24px 14px;border-right:1px solid color-mix(in srgb,var(--line) 85%,transparent)}
.nav{gap:7px}.nav button{padding:12px 13px;border-radius:13px;font-weight:650}.nav button.active{background:var(--panel);box-shadow:var(--shadow-soft);color:var(--text);border:1px solid var(--line)}
.main{padding:38px 38px 56px}.hero{padding:8px 0 2px}.eyebrow{font-size:.71rem;letter-spacing:.13em}.hero h1{font-size:clamp(2.25rem,5vw,4.1rem);letter-spacing:-.065em;line-height:.96;margin:.45rem 0 .8rem}.hero p{font-size:1rem;max-width:760px}
.grid{gap:18px;margin-top:28px}.card{border:1px solid color-mix(in srgb,var(--line) 88%,transparent);border-radius:24px;padding:21px;box-shadow:var(--shadow);background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 100%,transparent),color-mix(in srgb,var(--panel) 96%,var(--bg)))}
.card h2,.card h3{letter-spacing:-.035em}.metric{font-size:2.35rem;line-height:1;font-weight:850}.kicker{font-size:.72rem;font-weight:760;letter-spacing:.11em}.pill{background:color-mix(in srgb,var(--panel2) 85%,transparent);border:1px solid color-mix(in srgb,var(--line) 75%,transparent);padding:6px 10px;color:var(--muted);font-weight:620}.progress{height:10px;background:color-mix(in srgb,var(--panel2) 90%,transparent);box-shadow:inset 0 1px 2px rgba(0,0,0,.05)}.progress>span{background:linear-gradient(90deg,var(--accent),#ef6e76);border-radius:999px;box-shadow:0 0 0 1px rgba(255,255,255,.12) inset}
.list{gap:10px}.list-item{border:1px solid color-mix(in srgb,var(--line) 88%,transparent);border-radius:16px;padding:14px;background:color-mix(in srgb,var(--bg) 62%,var(--panel));transition:transform .15s ease,border-color .15s ease}.list-item:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--accent) 26%,var(--line))}
input,textarea,select{background:color-mix(in srgb,var(--panel2) 54%,var(--panel));border-radius:14px;padding:12px 13px}.notice{border-radius:16px;padding:14px 15px;border:1px solid color-mix(in srgb,var(--line) 82%,transparent);background:color-mix(in srgb,var(--panel2) 72%,transparent)}
.flashcard{min-height:300px;border-radius:26px;background:radial-gradient(circle at 75% 15%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 36%),linear-gradient(145deg,var(--panel),var(--panel2));box-shadow:var(--shadow)}
.bubble{border-radius:18px;padding:12px 14px}.bubble.user{background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 18%,transparent)}
.a2-card{position:relative;overflow:hidden;background:linear-gradient(145deg,#241719 0%,#5f2026 55%,#b92834 100%);color:#fff;border:0;box-shadow:0 22px 50px rgba(135,30,41,.26)}
.a2-card:after{content:"A2";position:absolute;right:-12px;bottom:-40px;font-size:9rem;line-height:1;font-weight:900;letter-spacing:-.08em;color:rgba(255,255,255,.07);pointer-events:none}.a2-card .kicker,.a2-card .muted{color:rgba(255,255,255,.72)}.a2-card .pill{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18);color:#fff}.a2-card .progress{background:rgba(255,255,255,.15)}.a2-card .progress>span{background:linear-gradient(90deg,#fff,#ffd9dc)}.a2-card .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18);color:#fff;backdrop-filter:blur(8px)}
.metric-card{position:relative;overflow:hidden}.metric-card:before{content:"";position:absolute;width:86px;height:86px;border-radius:50%;right:-30px;top:-30px;background:color-mix(in srgb,var(--accent) 8%,transparent)}
.session-card{background:linear-gradient(155deg,color-mix(in srgb,var(--panel) 96%,white),color-mix(in srgb,var(--accent) 5%,var(--panel)));}
.seg{gap:8px}.seg button{font-weight:680}.seg button.active{background:var(--text);color:var(--bg);border-color:var(--text);box-shadow:0 7px 18px rgba(0,0,0,.12)}
.mobile-nav{border-top:1px solid color-mix(in srgb,var(--line) 80%,transparent);background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(22px) saturate(150%);box-shadow:0 -10px 30px rgba(0,0,0,.08)}.mobile-nav button{font-size:.68rem;font-weight:680;padding:8px 8px;border-radius:14px;transition:background .15s ease,color .15s ease,transform .15s ease}.mobile-nav button:first-line{font-size:1rem}.mobile-nav button.active{background:color-mix(in srgb,var(--accent) 10%,var(--panel));color:var(--accent);transform:translateY(-1px)}
@media(max-width:900px){.main{padding:28px 18px 112px}.grid{gap:14px}}
@media(max-width:620px){body{background:radial-gradient(520px 320px at 100% 0%,color-mix(in srgb,var(--accent) 8%,transparent),transparent 70%),var(--bg)}.topbar{height:calc(66px + env(safe-area-inset-top));padding-left:16px;padding-right:16px}.brand-mark{width:32px;height:32px}.main{padding:22px 15px calc(116px + env(safe-area-inset-bottom))}.hero{padding-top:3px}.hero h1{font-size:2.55rem}.hero p{font-size:.95rem}.grid{margin-top:22px}.card{border-radius:22px;padding:18px}.metric{font-size:2.15rem}.a2-card{padding:22px}.a2-card:after{font-size:7rem;right:-6px;bottom:-28px}.mobile-nav{padding:7px 6px calc(7px + env(safe-area-inset-bottom));gap:2px}.mobile-nav button{min-width:68px}.flashcard{min-height:280px}.btn{min-height:44px}.seg button{min-height:42px}}

  
/* ---- Streamlined course UI ---- */
:root{--blue:#4f7cff;--purple:#8b5cf6;--orange:#f59e42;--green:#2fbf8f;--pink:#ec6aa8;}
.course-stack{display:grid;gap:16px;width:100%;max-width:820px;margin:24px auto 0}
.course-hero{border-radius:28px;padding:24px;color:#fff;box-shadow:0 18px 42px rgba(49,63,111,.16);overflow:hidden;position:relative}
.course-hero.color-blue{background:linear-gradient(135deg,#5276f5,#6c8cff 60%,#8aa4ff)}
.course-hero.color-purple{background:linear-gradient(135deg,#7c52e7,#9b6df0)}
.course-hero.color-green{background:linear-gradient(135deg,#1ca77b,#42c89c)}
.course-hero h2{font-size:1.8rem;margin:.3rem 0 .45rem;letter-spacing:-.04em}.course-hero p{margin:0 0 18px;color:rgba(255,255,255,.86);line-height:1.45}.light{color:rgba(255,255,255,.78)}.light-muted{color:rgba(255,255,255,.72)}
.course-hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.readiness-ring{width:76px;height:76px;flex:0 0 76px;border-radius:50%;border:7px solid rgba(255,255,255,.28);display:grid;place-items:center;text-align:center;background:rgba(255,255,255,.08)}.readiness-ring strong{font-size:1.25rem;line-height:1}.readiness-ring span{font-size:.68rem;opacity:.8;margin-top:-16px}
.course-primary{width:100%;background:#fff!important;color:#20253d!important;border:0!important;font-weight:800;min-height:50px;box-shadow:0 8px 22px rgba(0,0,0,.12)!important}.course-progress{height:6px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden;margin:16px 0 7px}.course-progress span{display:block;height:100%;background:#fff;border-radius:inherit}
.section-block{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow-soft);width:100%}.soft-card{background:color-mix(in srgb,var(--panel) 88%,var(--blue) 12%)}.section-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px}.section-heading h2,.section-heading h3{margin:.15rem 0 0;letter-spacing:-.035em}.text-btn{border:0;background:transparent;color:var(--blue);font-weight:750;padding:8px}.count-badge{display:grid;place-items:center;min-width:34px;height:34px;padding:0 10px;border-radius:999px;background:var(--panel2);font-weight:800}

// ---- utils.js ----
const uid = (prefix='id') => `${prefix}_${crypto.randomUUID ? crypto.randomUUID() : Date.now()+Math.random()}`;
const nowISO = () => new Date().toISOString();
const daysFromNowISO = days => new Date(Date.now() + days * 86400000).toISOString();
const minutesFromNowISO = mins => new Date(Date.now() + mins * 60000).toISOString();
const clamp = (n, min, max) => Math.min(max, Math.max(min, n));
const normalize = s => (s || '').toLocaleLowerCase('pl-PL').trim().replace(/[.,!?;:]/g,'').replace(/\s+/g,' ');
const escapeHtml = s => String(s ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
const dateLabel = iso => new Intl.DateTimeFormat('en', {month:'short', day:'numeric'}).format(new Date(iso));
const sameDay = (a,b) => new Date(a).toDateString() === new Date(b).toDateString();
function shuffled(items) { return [...items].sort(() => Math.random() - .5); }
function scoreToPct(correct,total){ return total ? Math.round(correct/total*100) : 0; }


// ---- scheduler.js ----

// SM-2-derived scheduler using four UI ratings mapped to SM-2 quality scores.
// Again=1, Hard=3, Good=4, Easy=5. Ease follows the published SM-2 update formula.
const RATING_QUALITY = { again: 1, hard: 3, good: 4, easy: 5 };

function newSchedule() {
  return { repetitions: 0, ease: 2.5, intervalDays: 0, due: new Date().toISOString(), lapses: 0, lastReview: null };
}

function scheduleReview(schedule, rating, at = new Date()) {
  const q = RATING_QUALITY[rating];
  if (!q) throw new Error(`Unknown rating: ${rating}`);
  let { repetitions=0, ease=2.5, intervalDays=0, lapses=0 } = schedule || newSchedule();
  const oldEase = ease;
  ease = clamp(ease + (0.1 - (5-q) * (0.08 + (5-q)*0.02)), 1.3, 3.0);

  let due;
  if (q < 3) {
    repetitions = 0;
    intervalDays = 0;
    lapses += 1;
    due = new Date(at.getTime() + 10 * 60000).toISOString();
  } else {
    repetitions += 1;
    if (repetitions === 1) intervalDays = rating === 'easy' ? 4 : 1;
    else if (repetitions === 2) intervalDays = rating === 'hard' ? 3 : rating === 'easy' ? 8 : 6;
    else {
      const modifier = rating === 'hard' ? 0.8 : rating === 'easy' ? 1.3 : 1;
      intervalDays = Math.max(1, Math.round(intervalDays * oldEase * modifier));
    }
    due = new Date(at.getTime() + intervalDays * 86400000).toISOString();
  }
  return { repetitions, ease: Number(ease.toFixed(3)), intervalDays, due, lapses, lastReview: at.toISOString() };
}

function isDue(schedule, at = new Date()) {
  return !schedule?.due || new Date(schedule.due) <= at;
}

function dueLabel(schedule) {
  const diff = new Date(schedule.due).getTime() - Date.now();
  if (diff <= 0) return 'Due now';
  const mins = Math.round(diff/60000);
  if (mins < 60) return `in ${mins} min`;
  const days = Math.round(diff/86400000);
  return days <= 1 ? 'tomorrow' : `in ${days} days`;
}

const VOCAB = [
  {id:'v1', lemma:'mieszkanie', meaning:'apartment / flat', gender:'neuter', forms:'gen. mieszkania; loc. mieszkaniu', example:'Szukam nowego mieszkania.', tags:['home','case-gen']},

  {id:'v7', lemma:'praca', meaning:'work / job', gender:'feminine', forms:'loc. pracy; gen. pracy', example:'Rozmawiamy o pracy.', tags:['work','case-loc']},
  {id:'v8', lemma:'potrzebować', meaning:'to need', gender:'verb', forms:'governs genitive', example:'Potrzebuję więcej czasu.', tags:['verbs','case-gen']},
  {id:'v9', lemma:'szukać', meaning:'to look for', gender:'verb', forms:'governs genitive', example:'Szukam kluczy.', tags:['verbs','case-gen']},

// ---- db.js ----

const DB_NAME = 'polskilab';
const DB_VERSION = 1;
const STORES = ['profile','topics','vocab','cards','reviews','mistakes','activity','writing'];
let dbPromise;

function openDB(){
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      for (const s of STORES) if (!db.objectStoreNames.contains(s)) db.createObjectStore(s,{keyPath:'id'});
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

async function getAll(store){ const db=await openDB(); return new Promise((res,rej)=>{ const r=db.transaction(store).objectStore(store).getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function get(store,id){ const db=await openDB(); return new Promise((res,rej)=>{ const r=db.transaction(store).objectStore(store).get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function put(store,value){ const db=await openDB(); return new Promise((res,rej)=>{ const r=db.transaction(store,'readwrite').objectStore(store).put(value); r.onsuccess=()=>res(value); r.onerror=()=>rej(r.error); }); }
async function add(store,value){ return put(store,value); }
async function remove(store,id){ const db=await openDB(); return new Promise((res,rej)=>{ const r=db.transaction(store,'readwrite').objectStore(store).delete(id); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); }
async function clear(store){ const db=await openDB(); return new Promise((res,rej)=>{ const r=db.transaction(store,'readwrite').objectStore(store).clear(); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); }
async function bulkPut(store,values){if(!values.length)return;const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite'),os=tx.objectStore(store);for(const v of values)os.put(v);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);});}

async function seed(){
  const existingProfile = await get('profile','me');
  if (!existingProfile) {
    await put('profile',{id:'me',name:'Learner',level:'A1',targetLevel:'A2',dailyMinutes:15,theme:'system',textbook:'Polski, krok po kroku',createdAt:nowISO()});
  } else {
    let changed=false;
    if(!existingProfile.targetLevel){ existingProfile.targetLevel='A2'; changed=true; }
    if(!existingProfile.textbook){ existingProfile.textbook='Polski, krok po kroku'; changed=true; }
    if(changed) await put('profile',existingProfile);
  }
  if ((await getAll('topics')).length === 0) for (const t of DEFAULT_TOPICS) await put('topics',{...t,source:'manual starter',volume:'',lesson:'',notes:'',updatedAt:nowISO()});
  const existingV=new Set((await getAll('vocab')).map(x=>x.id)), existingC=new Set((await getAll('cards')).map(x=>x.id));
  const missingV=ALL_VOCAB.filter(v=>!existingV.has(v.id)), missingC=[];
  for(const v of ALL_VOCAB) for(const direction of ['pl-en','en-pl']){const cid=`${v.id}:${direction}`;if(!existingC.has(cid))missingC.push({id:cid,vocabId:v.id,direction,schedule:newSchedule(),createdAt:nowISO()});}
  await bulkPut('vocab',missingV); await bulkPut('cards',missingC);
}

async function logActivity(data){ return put('activity',{id:uid('act'),at:nowISO(),...data}); }
async function logMistake(data){ return put('mistakes',{id:uid('mistake'),createdAt:nowISO(),timesSeen:1,resolved:false,...data}); }

async function exportData(){
  const out = {version:1, exportedAt:nowISO(), stores:{}};
  for (const s of STORES) out.stores[s]=await getAll(s);
  return out;
}
async function importData(data){
  if (!data?.stores) throw new Error('Invalid PolskiLab export');
  for (const s of STORES) {
    await clear(s);
    for (const item of (data.stores[s] || [])) await put(s,item);
  }
}


// ---- grammar.js ----

function evaluateExercise(exercise, input) {
  const n = normalize(input);
  const accepted = exercise.accepted.map(normalize);
  const exact = accepted.includes(n);
  if (exact) return { correct:true, status:'correct', message:'Correct.' };

  // Conservative partial matching only for explanation-style responses.
  if (exercise.type === 'explain' && n.includes('genitive') && n.includes('potrzeb')) {
    return {correct:true, status:'correct', message:'Correct reasoning.'};
  }
  return { correct:false, status:'incorrect', message:'Not quite.' };
}

function diacriticHint(input, answer) {
  const strip = s => normalize(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  return strip(input) === strip(answer) && normalize(input) !== normalize(answer)
    ? 'Your structure is right, but check the Polish diacritics.' : null;
}

   I('Translate: I help my friend.',['Pomagam koledze','Pomagam przyjacielowi'],'Pomagam koledze.','Pomagać takes dative.','dative'),

 {id:'u6',title:'Talk about the past',subtitle:'Describe yesterday, weekends and experiences',canDo:'I can describe simple past events and experiences.',lessons:[
  L('l21','Yesterday','Past tense · gender agreement',['past-tense','agreement'],[
   T('Past tense changes with the speaker','Polish past forms show gender in singular.','Wczoraj pracowałem. / Wczoraj pracowałam. Potem oglądałem film.'),

   W('Write 3 sentences about your last weekend.','Try to use “potem”.','past-tense')]),
  L('l23','Experiences','Byłem/byłam · places · activities',['past-tense','experiences'],[

   I('Translate: I was at a restaurant yesterday.',['Wczoraj byłem w restauracji','Wczoraj byłam w restauracji'],'Wczoraj byłem w restauracji.','Natural past location sentence.','experiences')]),
  L('l24','What happened?','Simple problems · explaining events',['past-tense','problems'],[
   T('Explain a small problem','Use bo / ponieważ to give a reason.','Spóźniłem się, bo autobus nie przyjechał. Zgubiłem klucze.'),

   S('Spóźniłem się, bo autobus nie przyjechał.','Repeat the explanation.','problems'),
   W('Write 2 sentences explaining a small problem.','Try to use “bo”.','problems')])]},
 {id:'u7',title:'Problems & services',subtitle:'Handle health, services and everyday difficulties',canDo:'I can explain common problems and ask for help.',lessons:[
  L('l25','At the pharmacy','Health · symptoms · need',['health','genitive'],[

   S('Oddzwonię później.','Repeat the phone phrase.','messages'),
   W('Write a 2-sentence message saying you will be late.','Include how late you expect to be.','messages')])]},
 {id:'u8',title:'Toward A2 independence',subtitle:'Give opinions, compare options and manage longer exchanges',canDo:'I can handle common A2 situations with connected simple language.',lessons:[

   S('Czy możemy spotkać się godzinę później?','Repeat the rearrangement question.','communication'),

 {id:'u9',title:'Food in real life',subtitle:'Shop, cook, order and talk about food in more detail',canDo:'I can buy food, discuss quantities and handle everyday food situations.',lessons:[
  L('l33','At the grocery shop','Products · quantities · requests',['food','quantities','genitive'],[

   S('Czy mogę prosić pół kilo jabłek?','Repeat the request as one chunk.','food'),
   W('Write a 3-item shopping list as full Polish requests.','Use quantities such as kilo, pół kilo, trochę or butelka.','food')]),

   I('Translate: Could I have this without onion?',['Czy mogę prosić to bez cebuli','Czy mogę prosić bez cebuli'],'Czy mogę prosić to bez cebuli?','Bez governs the genitive: cebula → cebuli.','requests'),
   S('Przepraszam, czy możemy zmienić zamówienie?','Repeat calmly and naturally.','restaurant'),
   W('Write a short polite complaint about a wrong restaurant order.','Explain the problem and ask for one solution.','problems')])]},

   S('Wolę cieplejszą pogodę.','Repeat the preference.','weather'),
   W('Compare the weather in two places you know.','Use at least one comparative with niż.','comparatives')])]},

function L(id,title,focus,skills,steps){return {id,title,focus,skills,steps}}

function W(title,promptHint,family){return {type:'writing',tag:'Write',title,promptHint,family}}

function Fill(title,accepted,answer,explain,family){const x=I(title,accepted,answer,explain,family);x.tag='Fill';return x}
function Scenario(title,options,answer,explain,family){const x=C(title,options,answer,explain,family);x.tag='Scenario';return x}
function Match(title,options,answer,explain,family){const x=C(title,options,answer,explain,family);x.tag='Match';return x}
function Recall(title,accepted,answer,explain,family){const x=I(title,accepted,answer,explain,family);x.tag='Recall';return x}
function courseBank(uid){return COURSE_BANKS[uid]||[]}
function shuffledWords(s,seed=0){const a=s.replace(/[?.!,]/g,'').split(/\s+/);return a.map((w,i)=>({w,k:(w.length*13+i*7+seed*11)%31})).sort((a,b)=>a.k-b.k).map(x=>x.w)}
function generatedSteps(uid,title,index,skills){

 const distract=[p2.pl,p3.pl].filter(x=>x!==p1.pl);

function lessonSteps(l){
 const steps=[...l.steps];
 const u=unitForLesson(l.id), bank=courseBank(u?.id);
 if(bank.length&&steps.length<8){
  const ix=Math.max(0,u.lessons.indexOf(l)),a=bank[(ix+1)%bank.length],b=bank[(ix+3)%bank.length],c=bank[(ix+4)%bank.length];
  steps.splice(Math.min(2,steps.length),0,Scenario(`In this situation, choose: “${a.en}”`,[a.pl,b.pl,c.pl],0,'Choose the natural response.',l.skills?.[0]||u.id));
  steps.splice(Math.max(2,steps.length-1),0,B(`Build: ${b.en}`,shuffledWords(b.pl,ix),b.pl,'Build the complete sentence.',l.skills?.[1]||l.skills?.[0]||u.id));
  steps.push(Recall(`Retrieve from memory: ${a.en}`,[a.pl.replace(/[?.!]$/,'')],a.pl,'Recall the full useful chunk.',l.skills?.[0]||u.id));
 }
 const seedNum=parseInt(String(l.id).replace(/\D/g,''))||1;
 const context=CONTEXT_BANK[seedNum%CONTEXT_BANK.length];
 const build=BUILD_BANK[seedNum%BUILD_BANK.length];
 if(context)steps.splice(Math.min(3,steps.length),0,{...context,tag:'In context'});
 if(build)steps.splice(Math.max(3,steps.length-1),0,{...build});
 const matching=GRAMMAR_EXERCISES.filter(g=>g.topics?.some(t=>l.skills?.includes(t)));
 const pool=matching.length?matching:GRAMMAR_EXERCISES;
 const ex=pool[seedNum%pool.length];
 if(ex)steps.splice(Math.max(3,steps.length-1),0,{type:'input',tag:'Recall',title:ex.prompt,accepted:ex.accepted,answer:ex.answer,explain:ex.explanation,family:ex.topics?.[0]||'interleaved'});
 return steps
}

async function checkChoice(step,idx,l){const ok=idx===step.answer;document.querySelectorAll('[data-choice]').forEach((b,i)=>{b.disabled=true;b.classList.toggle('correct',i===step.answer);b.classList.toggle('wrong',i===idx&&!ok)});await recordScored(ok,step,l,String(step.options[idx]||''));const fb=document.querySelector('#stepFeedback');fb.innerHTML=`<div class="feedback-strip ${ok?'good':'bad'}"><strong>${ok?'Correct.':'Not quite.'}</strong> ${escapeHtml(step.explain||'')}</div><button class="next-btn" id="afterChoice">Continue</button>`;document.querySelector('#afterChoice').onclick=()=>advance(ok,step,l)}

async function recordScored(ok,step,l,userAnswer){const family=step.family||l.skills?.[0]||'general';state.lessonResults.push({type:step.type,ok,family});await logActivity({type:'lesson_item',lessonId:l.id,family,correct:ok,confidence:state.confidence||null});if(!ok)await logMistakeFamily({family,concept:family,exerciseType:step.type,prompt:step.title,userAnswer,correctAnswer:step.answer||step.options?.[step.answer]||'',explanation:step.explain||''})}

async function finishLesson(l){const scored=state.lessonResults;const correct=scored.filter(r=>r.ok).length;const pct=scored.length?Math.round(correct/scored.length*100):100;if(!state.profile.completedLessons.includes(l.id)){state.profile.completedLessons.push(l.id);await put('profile',state.profile)}await logActivity({type:'lesson_complete',lessonId:l.id,score:pct,family:l.skills?.[0]});await refresh();const u=unitForLesson(l.id),checkpoint=unitComplete(u);view(`<div class="lesson-shell"><section class="step-card" style="text-align:center;justify-content:center"><span class="step-tag">Lesson complete</span><div class="recap-score">${pct}%</div><h2>${escapeHtml(l.title)}</h2><p>${pct<70?'This lesson exposed useful weaknesses. They are now scheduled for delayed review.':'Good. The important test is whether it still sticks later.'}</p><div class="recap-list"><div>✓ ${correct} of ${scored.length} scored activities correct</div><div>↻ Mistakes return later with different examples</div>${checkpoint?`<div>◎ Unit checkpoint is now available</div>`:''}</div><button class="next-btn" id="backCourse">${checkpoint?'Back to unit checkpoint':'Continue course'}</button></section></div>`);document.querySelector('#backCourse').onclick=()=>{state.lessonId=null;state.route='course';shell()}}

function checkpointPool(unitId){const fam=UNIT_CHECKPOINTS[unitId]||[];let qs=GRAMMAR_EXERCISES.filter(g=>g.topics?.some(t=>fam.includes(t)||fam.some(f=>t.includes(f))));if(qs.length<4)qs=[...qs,...GRAMMAR_EXERCISES.filter(g=>!qs.includes(g))];return qs.slice(0,6)}

function renderReview(){const due=dueCards().length,open=dueMistakes().length,weak=familyStats().slice(0,3);view(`<section class="review-hero"><div class="eyebrow" style="color:rgba(255,255,255,.8)">Practice</div><h1 style="margin:.25rem 0;font-size:2rem">Review what needs work</h1><p style="margin:0;color:rgba(255,255,255,.86)">Course moves forward. Review repairs vocabulary and grammar that did not stick.</p></section><div class="review-choice-grid"><button class="review-choice vocab" id="vocabReview"><div><div class="big-icon">▣</div><h3>Vocabulary review</h3><p>Spaced repetition, production and context.</p></div><strong>${due} due now →</strong></button><button class="review-choice grammar" id="grammarReview"><div><div class="big-icon">Aa</div><h3>Grammar practice</h3><p>Weak patterns, delayed mistakes and targeted drills.</p></div><strong>${open} repair items due →</strong></button></div>${weak.length?`<div class="simple-card"><h3>Current weak patterns</h3><div class="weak-list">${weak.map(w=>`<div><span>${escapeHtml(prettyFamily(w.family))}</span><div class="progress"><span style="width:${w.score}%"></span></div><strong>${w.score}%</strong></div>`).join('')}</div></div>`:''}`);document.querySelector('#vocabReview').onclick=()=>{state.route='vocab';renderVocab()};document.querySelector('#grammarReview').onclick=()=>{state.route='grammar';state.grammarFocus=null;renderGrammar()}}

function renderGrammar(){if(!state.grammarFocus){const open=dueMistakes().length;view(`<div class="lesson-shell"><div class="lesson-top"><button class="back-btn" id="rgBack">←</button><div><strong>Grammar practice</strong><div class="small muted">Choose a focus</div></div></div><section class="step-card"><span class="step-tag">Grammar</span><h2>What needs practice?</h2><div class="focus-grid"><button class="focus-btn" data-gfocus="weak"><strong>Recommended for you</strong><span>Current weakest pattern: ${escapeHtml(prettyFamily(weakestFamily()))}</span></button><button class="focus-btn" data-gfocus="mistakes"><strong>Due mistake repairs</strong><span>${open} delayed errors ready now</span></button><button class="focus-btn" data-gfocus="mixed"><strong>Mixed challenge</strong><span>Translation, choice, correction and sentence building</span></button><button class="focus-btn" data-gfocus="cases"><strong>Cases in context</strong><span>Accusative, genitive, dative, instrumental, locative</span></button><button class="focus-btn" data-gfocus="agreement"><strong>Agreement</strong><span>Adjectives, pronouns and noun forms</span></button><button class="focus-btn" data-gfocus="verbs"><strong>Verb patterns</strong><span>Government, negation and common structures</span></button></div></section></div>`);document.querySelector('#rgBack').onclick=()=>{state.route='review';shell()};document.querySelectorAll('[data-gfocus]').forEach(b=>b.onclick=()=>{state.grammarFocus=b.dataset.gfocus;renderGrammar()});return}const m=state.grammarFocus==='mistakes'?dueMistakes()[0]:null;let srcp=m?null:grammarPool(state.grammarFocus);if(state.grammarFocus==='mistakes'&&!m){state.grammarFocus=null;renderGrammar();return}if(!m&&(!srcp||!srcp.length))srcp=GRAMMAR_EXERCISES;const base=m?null:srcp[Math.floor(Math.random()*srcp.length)];const ex=m?{prompt:m.prompt,answer:m.correctAnswer,accepted:[m.correctAnswer],explain:m.explanation,family:m.family}:base;const count=state.activity.filter(a=>a.type==='gr nswer: '+escapeHtml(ex.answer)}</strong>${(ex.explain||ex.explanation)?`<br>${escapeHtml(ex.explain||ex.explanation)}`:''}</div><button class="next-btn" id="gNext">Next challenge</button>`;if(ok&&m){m.resolved=true;m.resolvedAt=nowISO();await put('mistakes',m)}if(!ok&&!m)await logMistakeFamily({family:ex.family||(ex.topics||[])[0]||'grammar',concept:(ex.topics||[]).join(','),exerciseType:'grammar_review',prompt:ex.prompt,userAnswer:val,correctAnswer:ex.answer,explanation:ex.explain||ex.explanation||''});await logActivity({type:'grammar_review',family:ex.family||(ex.topics||[])[0]||state.grammarFocus,correct:ok,confidence:conf,format:mode});await refresh();document.querySelector('#gNext').onclick=renderGrammar};document.querySelector('#rgBack').onclick=()=>{state.grammarFocus=null;renderGrammar()};document.querySelectorAll('[data-gconf]').forEach(b=>b.onclick=()=>{conf=b.dataset.gconf;document.querySelectorAll('[data-gconf]').forEach(x=>x.classList.toggle('active',x===b))});if(document.querySelector('#repairCheck'))document.querySelector('#repairCheck').onclick=()=>{const val=document.querySelector('#repairInput').value;finish((ex.accepted||[ex.answer]).map(normalize).includes(normalize(val)),val)};document.querySelectorAll('[data-gopt]').forEach(b=>b.onclick=()=>{const val=b.dataset.gopt;document.querySelectorAll('[data-gopt]').forEach(x=>x.disabled=true);finish(normalize(val)===normalize(ex.answer),val)});let parts=[];if(document.querySelector('#gCheckBuild')){const draw=()=>document.querySelector('#gBuild').innerHTML=parts.length?parts.map(w=>`<span class="build-chip">${escapeHtml(w)}</span>`).join(''):'<span class="small muted">Build the answer from the words.</span>';document.querySelectorAll('[data-gbuild]').forEach(b=>b.onclick=()=>{parts.push(b.textContent);draw()});document.querySelector('#gClear').onclick=()=>{parts=[];draw()};document.querySelector('#gCheckBuild').onclick=()=>{const val=parts.join(' ');finish(normalize(val)===normalize(ex.answer),val)}}}
function a2Model(){const lessons=completed().size,total=lessonFlat().length;const course=lessons/total;const scored=state.activity.filter(a=>typeof a.correct==='boolean');const acc=scored.length?scored.filter(a=>a.correct).length/scored.length:0;const cps=Object.values(state.profile.checkpoints||{});const cp=cps.length?cps.reduce((s,x)=>s+x.score,0)/(cps.length*100):0;const evidence=Math.min(1,(scored.length+cps.length*8)/100);const readiness=Math.round(100*((course*.38)+(acc*.32)+(cp*.30))*Math.sqrt(Math.max(.12,evidence)));return {readiness,evidence:Math.round(evidence*100),course:Math.round(course*100),acc:scored.length?Math.round(acc*100):0,checkpoint:Math.round(cp*100)}}
function renderProgress(){const a=a2Model(),families=familyStats().slice(0,6),cal=confidenceCalibration();const recent=state.activity.filter(x=>new Date(x.at)>new Date(Date.now()-7*86400000)).length;view(`<section class="progress-hero"><div class="eyebrow" style="color:rgba(255,255,255,.8)">Goal: A2</div><h1 style="margin:.25rem 0;font-size:2rem">${a.readiness}% estimated readiness</h1><p style="margin:0;color:rgba(255,255,255,.86)">Cautious internal estimate based on coverage, performance and delayed checkpoints.</p></section><div class="progress-grid"><div class="simple-card"><h3>Curriculum coverage</h3><div class="metric">${a.course}%</div><div class="progress"><span style="width:${a.course}%"></span></div></div><div class="simple-card"><h3>Scored accuracy</h3><div class="metric">${a.acc||'—'}${a.acc?'%':''}</div><div class="small muted">${a.evidence}% evidence coverage</div></div><div class="simple-card"><h3>Delayed checkpoints</h3><div class="metric">${a.checkpoint||'—'}${a.checkpoint?'%':''}</div><div class="small muted">Weighted heavily because delayed recall matters.</div></div><div class="simple-card"><h3>Confidence calibration</h3><div class="metric">${cal===null?'—':cal+'%'}</div><div class="small muted">Accuracy when you said you were sure.</div></div></div><div class="simple-card"><h3>A2 can-do map</h3><div class="cando-list">${COURSE.map((u,i)=>{const cp=state.profile.checkpoints?.[u.id];return `<div><span class="cando-dot ${cp?.score>=70?'on':''}">${cp?.score>=70?'✓':i+1}</span><span><strong>${escapeHtml(u.title)}</strong><small>${escapeHtml(u.canDo)}</small></span><b>${cp?cp.score+'%':'Not checked'}</b></div>`}).join('')}</div></div><div class="simple-card"><h3>Weakness map</h3>${families.length?`<div class="weak-list">${families.map(w=>`<div><span>${escapeHtml(prettyFamily(w.family))}</span><div class="progress"><span style="width:${w.score}%"></span></div><strong>${w.score}%</strong></div>`).join('')}</div>`:'<p class="muted">Complete more scored practice to build a weakness map.</p>'}</div><div class="simple-card"><div class="row space"><span>Practice in last 7 days</span><strong>${recent}</strong></div><div class="row space" style="margin-top:8px"><span>Unresolved mistake families</span><strong>${new Set(state.mistakes.filter(m=>!m.resolved).map(familyOfMistake)).size}</strong></div></div><button class="btn" id="openBook" style="width:100%">Manage textbook link</button>`);document.querySelector('#openBook').onclick=()=>{state.route='textbook';shell()}}

function renderTextbook(){view(`<div class="lesson-shell"><div class="lesson-top"><button class="back-btn" id="tbBack">←</button><div><strong>Textbook link</strong><div class="small muted">Polski, krok po kroku</div></div></div><section class="step-card"><span class="step-tag">Companion</span><h2>What did you study today?</h2><p>The course remains CEFR-oriented. The book tells PolskiLab which concepts are fair game for earlier review.</p><div class="answer-area"><input id="tbLesson" class="lesson-input" placeholder="Lesson/chapter (e.g. 7)"><input id="tbTopic" class="lesson-input" placeholder="Topic (e.g. genitive after szukać)"><select id="tbArea" class="lesson-input"><option>Grammar</option><option>Vocabulary</option><option>Conversation</option><option>Reading</option><option>Writing</option></select><button class="next-btn" id="tbAdd">Add studied topic</button><div class="recap-list">${state.topics.slice(-8).reverse().map(t=>`<div>${escapeHtml(t.title)} <span class="small muted">${escapeHtml(t.lesson||'')} · ${escapeHtml(t.category||'')}</span></div>`).join('')}</div></div></section></div>`);document.querySelector('#tbBack').onclick=()=>{state.route='course';shell()};document.querySelector('#tbAdd').onclick=async()=>{const title=document.querySelector('#tbTopic').value.trim();if(!title)return;await put('topics',{id:uid('topic'),title,category:document.querySelector('#tbArea').value,status:'in_progress',lesson:document.querySelector('#tbLesson').value.trim(),source:'Polski, krok po kroku',updatedAt:nowISO()});await refresh();renderTextbook()}}

function showDataDialog(){const modal=document.createElement('div');Object.assign(modal.style,{position:'fixed',inset:0,background:'rgba(0,0,0,.5)',zIndex:80,display:'grid',placeItems:'center',padding:'20px'});modal.innerHTML=`<div class="card" style="max-width:520px;width:100%"><h2>Your data</h2><p class="muted">Export a JSON backup or import one.</p><div class="row"><button class="btn primary" id="exportBtn">Export</button><button class="btn" id="importBtn">Import</button><button class="btn ghost" id="closeData">Close</button></div></div>`;document.body.appendChild(modal);modal.querySelector('#closeData').onclick=()=>modal.remove();modal.querySelector('#exportBtn').onclick=async()=>{const data=await exportData();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='polskilab-backup.json';a.click();URL.revokeObjectURL(url)};modal.querySelector('#importBtn').onclick=()=>{modal.remove();document.querySelector('#importFile').click()}}
async function handleImport(e){const f=e.target.files?.[0];if(!f)return;const data=JSON.parse(await f.text());await importData(data);await refresh();shell()}
async function init(){await seed();await refresh();document.documentElement.dataset.theme=state.profile?.theme==='dark'?'dark':state.profile?.theme==='light'?'light':'';shell();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})}
init().catch(err=>{document.querySelector('#app').innerHTML=`<main class="main"><div class="feedback bad"><strong>PolskiLab could not start.</strong><pre>${escapeHtml(err.stack||err.message)}</pre></div></main>`});

</script>
</body>
