g:-.025em}.metric{font-size:2rem;font-weight:800;letter-spacing:-.04em}.muted{color:var(--muted)}.small{font-size:.86rem}.pill{display:inline-flex;border-radius:999px;padding:5px 9px;background:var(--panel2);color:var(--muted);font-size:.78rem}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.stack{display:grid;gap:12px}.field{display:grid;gap:6px}.field label{font-size:.84rem;color:var(--muted)}input,textarea,select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px 12px;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{min-height:110px;resize:vertical}.progress{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}.progress>span{display:block;height:100%;background:var(--accent)}.list{display:grid;gap:8px}.list-item{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg)}.exercise{max-width:760px;margin:18px auto}.prompt{font-size:1.35rem;line-height:1.45;margin:18px 0}.feedback{padding:12px;border-radius:12px;background:var(--panel2);line-height:1.5}.feedback.good{border-left:4px solid var(--good)}.feedback.bad{border-left:4px solid var(--accent)}.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button.active{background:var(--text);color:var(--bg)}.rating{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.rating button{padding:12px 8px}.flashcard{min-height:270px;display:grid;place-items:center;text-align:center;padding:28px;border-radius:18px;background:linear-gradient(145deg,var(--panel),var(--panel2));border:1px solid var(--line)}.flash-main{font-size:2rem;font-weight:750;letter-spacing:-.03em}.flash-sub{color:var(--muted);margin-top:8px}.kicker{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.topic-row{display:grid;grid-template-columns:1.3fr .8fr .8fr 1fr auto;gap:8px;align-items:center}.chart-bars{display:flex;align-items:end;gap:7px; /* ---- PolskiLab visual refresh ---- */
:root{
  --bg:#f7f5f2;--panel:#fffdfb;--panel2:#f1eeea;--text:#171719;--muted:#747075;--line:#e7e1dc;
  --accent:#d52b35;--accent2:#a81924;--good:#18865a;--warn:#b46f14;
  --shadow:0 18px 55px rgba(61,42,35,.08),0 2px 8px rgba(61,42,35,.05);
  --shadow-soft:0 8px 28px rgba(61,42,35,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1012;--panel:#18191c;--panel2:#222328;--text:#f7f5f2;--muted:#a9a6aa;--line:#2d2f34;--accent:#ff5b64;--accent2:#ff8990;--good:#55cf99;--warn:#efb461;--shadow:0 18px 55px rgba(0,0,0,.28);--shadow-soft:0 8px 28px rgba(0,0,0,.2)}}
:root[data-theme="dark"]{--bg:#0f1012;--panel:#18191c;--panel2:#222328;--text:#f7f5f2;--muted:#a9a6aa;--line:#2d2f34;--accent:#ff5b64;--accent2:#ff8990;--good:#55cf99;--warn:#efb461;--shadow:0 18px 55px rgba(0,0,0,.28);--shadow-soft:0 8px 28px rgba(0,0,0,.2)}
html{background:var(--bg)}
body{background:
  radial-gradient(900px 520px at 85% -10%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 65%),
  radial-gradient(700px 420px at -10% 15%,rgba(255,255,255,.65),transparent 65%),var(--bg);}
.topbar{height:70px;padding:0 24px;border-bottom:1px solid color-mix(in srgb,var(--line) 82%,transparent);background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(24px) saturate(150%)}
.brand{font-size:1.03rem;gap:11px}.brand-mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#fff 0 47%,var(--accent) 48% 100%);box-shadow:0 5px 14px rgba(213,43,53,.22),inset 0 0 0 1px rgba(0,0,0,.08);transform:rotate(-2deg)}
.icon-btn,.btn,.seg button,.rating button{border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 96%,transparent);border-radius:14px;padding:11px 14px;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease,background .16s ease}
.btn:hover,.icon-btn:hover,.seg button:hover,.rating button:hover{transform:translateY(-1px);box-shadow:var(--shadow-soft)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 24%,transparent);font-weight:760}
.layout{max-width:1320px;grid-template-columns:230px minmax(0,1fr)}
.sidebar{top:70px;height:calc(100vh - 70px);padding:24px 14px;border-right:1px solid color-mix(in srgb,var(--line) 85%,transparent)}
.nav{gap:7px}.nav button{padding:12px 13px;border-radius:13px;font-weight:650}.nav button.active{background:var(--panel);box-shadow:var(--shadow-soft);color:var(--text);border:1px solid var(--line)}
.main{padding:38px 38px 56px}.hero{padding:8px 0 2px}.eyebrow{font-size:.71rem;letter-spacing:.13em}.hero h1{font-size:clamp(2.25rem,5vw,4.1rem);letter-spacing:-.065em;line-height:.96;margin:.45rem 0 .8rem}.hero p{font-size:1rem;max-width:760px}
.grid{gap:18px;margin-top:28px}.card{border:1px solid color-mix(in srgb,var(--line) 88%,transparent);border-radius:24px;padding:21px;box-shadow:var(--shadow);background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 100%,transparent),color-mix(in srgb,var(--panel) 96%,var(--bg)))}
.card h2,.card h3{letter-spacing:-.035em}.metric{font-size:2.35rem;line-height:1;font-weight:850}.kicker{font-size:.72rem;font-weight:760;letter-spacing:.11em}.pill{background:color-mix(in srgb,var(--panel2) 85%,transparent);border:1px solid color-mix(in srgb,var(--line) 75%,transparent);padding:6px 10px;color:var(--muted);font-weight:620}.progress{height:10px;background:color-mix(in srgb,var(--panel2) 90%,transparent);box-shadow:inset 0 1px 2px rgba(0,0,0,.05)}.progress>span{background:linear-gradient(90deg,var(--accent),#ef6e76);border-radius:999px;box-shadow:0 0 0 1px rgba(255,255,255,.12) inset}
.list{gap:10px}.list-item{border:1px solid color-mix(in srgb,var(--line) 88%,transparent);border-radius:16px;padding:14px;background:color-mix(in srgb,var(--bg) 62%,var(--panel));transition:transform .15s ease,border-color .15s ease}.list-item:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--accent) 26%,var(--line))}
input,textarea,select{background:color-mix(in srgb,var(--panel2) 54%,var(--panel));border-radius:14px;padding:12px 13px}.notice{border-radius:16px;padding:14px 15px;border:1px solid color-mix(in srgb,var(--line) 82%,transparent);background:color-mix(in srgb,var(--panel2) 72%,transparent)}
.flashcard{min-height:300px;border-radius:26px;background:radial-gradient(circle at 75% 15%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 36%),linear-gradient(145deg,var(--panel),var(--panel2));box-shadow:var(--shadow)}
.bubble{border-radius:18px;padding:12px 14px}.bubble.user{background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 18%,transparent)}
.a2-card{position:relative;overflow:hidden;background:linear-gradient(145deg,#241719 0%,#5f2026 55%,#b92834 100%);color:#fff;border:0;box-shadow:0 22px 50px rgba(135,30,41,.26)}
.a2-card:after{content:"A2";position:absolute;right:-12px;bottom:-40px;font-size:9rem;line-height:1;font-weight:900;letter-spacing:-.08em;color:rgba(255,255,255,.07);pointer-events:none}.a2-card .kicker,.a2-card .muted{color:rgba(255,255,255,.72)}.a2-card .pill{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18);color:#fff}.a2-card .progress{background:rgba(255,255,255,.15)}.a2-card .progress>span{background:linear-gradient(90deg,#fff,#ffd9dc)}.a2-card .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18);color:#fff;backdrop-filter:blur(8px)}
.metric-card{position:relative;overflow:hidden}.metric-card:before{content:"";position:absolute;width:86px;height:86px;border-radius:50%;right:-30px;top:-30px;background:color-mix(in srgb,var(--accent) 8%,transparent)}
.session-card{background:linear-gradient(155deg,color-mix(in srgb,var(--panel) 96%,white),color-mix(in srgb,var(--accent) 5%,var(--panel)));}
.seg{gap:8px}.seg button{font-weight:680}.seg button.active{background:var(--text);color:var(--bg);border-color:var(--text);box-shadow:0 7px 18px rgba(0,0,0,.12)}
.mobile-nav{border-top:1px solid color-mix(in srgb,var(--line) 80%,transparent);background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(22px) saturate(150%);box-shadow:0 -10px 30px rgba(0,0,0,.08)}.mobile-nav button{font-size:.68rem;font-weight:680;padding:8px 8px;border-radius:14px;transition:background .15s ease,color .15s ease,transform .15s ease}.mobile-nav button:first-line{font-size:1rem}.mobile-nav button.active{background:color-mix(in srgb,var(--accent) 10%,var(--panel));color:var(--accent);transform:translateY(-1px)}
@media(max-width:900px){.main{padding:28px 18px 112px}.grid{gap:14px}}
@media(max-width:620px){body{background:radial-gradient(520px 320px at 100% 0%,color-mix(in srgb,var(--accent) 8%,transparent),transparent 70%),var(--bg)}.topbar{height:calc(66px + env(safe-area-inset-top));padding-left:16px;padding-right:16px}.brand-mark{width:32px;height:32px}.main{padding:22px 15px calc(116px + env(safe-area-inset-bottom))}.hero{padding-top:3px}.hero h1{font-size:2.55rem}.hero p{font-size:.95rem}.grid{margin-top:22px}.card{border-radius:22px;padding:18px}.metric{font-size:2.15rem}.a2-card{padding:22px}.a2-card:after{font-size:7rem;right:-6px;bottom:-28px}.mobile-nav{padding:7px 6px calc(7px + env(safe-area-inset-bottom));gap:2px}.mobile-nav button{min-width:68px}.flashcard{min-height:280px}.btn{min-height:44px}.seg button{min-height:42px}}

  
/* ---- Streamlined course UI ---- */
:root{--blue:#4f7cff;--purple:#8b5cf6;--orange:#f59e42;--green:#2fbf8f;--pink:#ec6aa8;}
.course-stack{display:grid;gap:16px;width:100%;max-width:820px;margin:24px auto 0}
.course-hero{border-radius:28px;padding:24px;color:#fff;box-shadow:0 18px 42px rgba(49,63,111,.16);overflow:hidden;position:relative}
.course-hero.color-blue{background:linear-gradient(135deg,#5276f5,#6c8cff 60%,#8aa4ff)}
.course-hero.color-purple{background:linear-gradient(135deg,#7c52e7,#9b6df0)}
.course-hero.color-green{background:linear-gradient(135deg,#1ca77b,#42c89c)}
.course-hero h2{font-size:1.8rem;margin:.3rem 0 .45rem;letter-spacing:-.04em}.course-hero p{margin:0 0 18px;color:rgba(255,255,255,.86);line-height:1.45}.light{color:rgba(255,255,255,.78)}.light-muted{color:rgba(255,255,255,.72)}
.course-hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.readiness-ring{width:76px;height:76px;flex:0 0 76px;border-radius:50%;border:7px solid rgba(255,255,255,.28);display:grid;place-items:center;text-align:center;background:rgba(255,255,255,.08)}.readiness-ring strong{font-size:1.25rem;line-height:1}.readiness-ring span{font-size:.68rem;opacity:.8;margin-top:-16px}
.course-primary{width:100%;background:#fff!important;color:#20253d!important;border:0!important;font-weight:800;min-height:50px;box-shadow:0 8px 22px rgba(0,0,0,.12)!important}.course-progress{height:6px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden;margin:16px 0 7px}.course-progress span{display:block;height:100%;background:#fff;border-radius:inherit}
.section-block{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow-soft);width:100%}.soft-card{background:color-mix(in srgb,var(--panel) 88%,var(--blue) 12%)}.section-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px}.section-heading h2,.section-heading h3{margin:.15rem 0 0;letter-spacing:-.035em}.text-btn{border:0;background:transparent;color:var(--blue);font-weight:750;padding:8px}.count-badge{display:grid;place-items:center;min-width:34px;height:34px;padding:0 10px;border-radius:999px;background:var(--panel2);font-weight:800}

// ---- scheduler.js ----

// SM-2-derived scheduler using four UI ratings mapped to SM-2 quality scores.
// Again=1, Hard=3, Good=4, Easy=5. Ease follows the published SM-2 update formula.
const RATING_QUALITY = { again: 1, hard: 3, good: 4, easy: 5 };

function newSchedule() {
  return { repetitions: 0, ease: 2.5, intervalDays: 0, due: new Date().toISOString(), lapses: 0, lastReview: null };
}

function scheduleReview(schedule, rating, at = new Date()) {
  const q = RATING_QUALITY[rating];
  if (!q) throw new Error(`Unknown rating: ${rating}`);
  let { repetitions=0, ease=2.5, intervalDays=0, lapses=0 } = schedule || newSchedule();
  const oldEase = ease;
  ease = clamp(ease + (0.1 - (5-q) * (0.08 + (5-q)*0.02)), 1.3, 3.0);

  let due;
  if (q < 3) {
    repetitions = 0;
    intervalDays = 0;
    lapses += 1;
    due = new Date(at.getTime() + 10 * 60000).toISOString();
  } else {
    repetitions += 1;
    if (repetitions === 1) intervalDays = rating === 'easy' ? 4 : 1;
    else if (repetitions === 2) intervalDays = rating === 'hard' ? 3 : rating === 'easy' ? 8 : 6;
    else {
      const modifier = rating === 'hard' ? 0.8 : rating === 'easy' ? 1.3 : 1;
      intervalDays = Math.max(1, Math.round(intervalDays * oldEase * modifier));
    }
    due = new Date(at.getTime() + intervalDays * 86400000).toISOString();
  }
  return { repetitions, ease: Number(ease.toFixed(3)), intervalDays, due, lapses, lastReview: at.toISOString() };
}

function isDue(schedule, at = new Date()) {
  return !schedule?.due || new Date(schedule.due) <= at;
}

function dueLabel(schedule) {
  const diff = new Date(schedule.due).getTime() - Date.now();
  if (diff <= 0) return 'Due now';
  const mins = Math.round(diff/60000);
  if (mins < 60) return `in ${mins} min`;
  const days = Math.round(diff/86400000);
  return days <= 1 ? 'tomorrow' : `in ${days} days`;
}

// ---- db.js ----

const DB_NAME = 'polskilab';
const DB_VERSION = 1;
const STORES = ['profile','topics','vocab','cards','reviews','mistakes','activity','writing'];
let dbPromise;

function openDB(){
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      for (const s of STORES) if (!db.objectStoreNames.contains(s)) db.createObjectStore(s,{keyPath:'id'});
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

async function getAll(store){ const db=await openDB(); return new Promise((res,rej)=>{ const r=db.transaction(store).objectStore(store).getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function get(store,id){ const db=await openDB(); return new Promise((res,rej)=>{ const r=db.transaction(store).objectStore(store).get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function put(store,value){ const db=await openDB(); return new Promise((res,rej)=>{ const r=db.transaction(store,'readwrite').objectStore(store).put(value); r.onsuccess=()=>res(value); r.onerror=()=>rej(r.error); }); }
async function add(store,value){ return put(store,value); }
async function remove(store,id){ const db=await openDB(); return new Promise((res,rej)=>{ const r=db.transaction(store,'readwrite').objectStore(store).delete(id); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); }
async function clear(store){ const db=await openDB(); return new Promise((res,rej)=>{ const r=db.transaction(store,'readwrite').objectStore(store).clear(); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); }

async function seed(){
  const existingProfile = await get('profile','me');
  if (!existingProfile) {
    await put('profile',{id:'me',name:'Learner',level:'A1',targetLevel:'A2',dailyMinutes:15,theme:'system',textbook:'Polski, krok po kroku',createdAt:nowISO()});
  } else {
    let changed=false;
    if(!existingProfile.targetLevel){ existingProfile.targetLevel='A2'; changed=true; }
    if(!existingProfile.textbook){ existingProfile.textbook='Polski, krok po kroku'; changed=true; }
    if(changed) await put('profile',existingProfile);
  }
  if ((await getAll('topics')).length === 0) for (const t of DEFAULT_TOPICS) await put('topics',{...t,source:'manual starter',volume:'',lesson:'',notes:'',updatedAt:nowISO()});
  if ((await getAll('vocab')).length === 0) {
    for (const v of VOCAB) {
      await put('vocab',v);
      for (const direction of ['pl-en','en-pl']) await put('cards',{id:`${v.id}:${direction}`,vocabId:v.id,direction,schedule:newSchedule(),createdAt:nowISO()});
    }
  }
}

async function logActivity(data){ return put('activity',{id:uid('act'),at:nowISO(),...data}); }
async function logMistake(data){ return put('mistakes',{id:uid('mistake'),createdAt:nowISO(),timesSeen:1,resolved:false,...data}); }

async function exportData(){
  const out = {version:1, exportedAt:nowISO(), stores:{}};
  for (const s of STORES) out.stores[s]=await getAll(s);
  return out;
}
async function importData(data){
  if (!data?.stores) throw new Error('Invalid PolskiLab export');
  for (const s of STORES) {
    await clear(s);
    for (const item of (data.stores[s] || [])) await put(s,item);
  }
}


// ---- grammar.js ----

function evaluateExercise(exercise, input) {
  const n = normalize(input);
  const accepted = exercise.accepted.map(normalize);
  const exact = accepted.includes(n);
  if (exact) return { correct:true, status:'correct', message:'Correct.' };

  // Conservative partial matching only for explanation-style responses.
  if (exercise.type === 'explain' && n.includes('genitive') && n.includes('potrzeb')) {
    return {correct:true, status:'correct', message:'Correct reasoning.'};
  }
  return { correct:false, status:'incorrect', message:'Not quite.' };
}

function diacriticHint(input, answer) {
  const strip = s => normalize(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  return strip(input) === strip(answer) && normalize(input) !== normalize(answer)
    ? 'Your structure is right, but check the Polish diacritics.' : null;
}

function toast(msg){
  const el=document.createElement('div');el.textContent=msg;Object.assign(el.style,{position:'fixed',right:'16px',top:'76px',background:'var(--text)',color:'var(--bg)',padding:'10px 14px',borderRadius:'10px',zIndex:100,fontWeight:700});document.body.appendChild(el);setTimeout(()=>el.remove(),1800);
}

function dueCards(){ return state.cards.filter(c=>isDue(c.schedule)); }
function recentActivities(days=7){ const cutoff=Date.now()-days*86400000; return state.activity.filter(a=>new Date(a.at).getTime()>=cutoff); }
function studiedTopicIds(){ return state.topics.filter(t=>t.status!=='not_studied').map(t=>t.id); }
function topicName(id){ return state.topics.find(t=>t.id===id)?.title || id.replace('case-','').replaceAll('-',' '); }

function scoredStats(type, predicate=()=>true){
  const xs=state.activity.filter(a=>a.type===type&&typeof a.correct==='boolean'&&predicate(a));
  const correct=xs.filter(a=>a.correct).length;
  return {count:xs.length, correct, accuracy:xs.length?correct/xs.length:0};
}
function a2Model(){
  const grammar=scoredStats('grammar');
  const vocabProd=scoredStats('vocab',a=>a.mode==='production');
  const reading=scoredStats('reading');
  const listening=scoredStats('listening');
  const conversation=scoredStats('conversation');
  const writingCount=state.activity.filter(a=>a.type==='writing').length;
  const domains=[
    {id:'grammar',label:'Grammar control',score:grammar.accuracy,evidence:grammar.count,target:24},
    {id:'vocab',label:'Vocabulary production',score:vocabProd.accuracy,evidence:vocabProd.count,target:30},
    {id:'reading',label:'Reading',score:reading.accuracy,evidence:reading.count,target:12},
    {id:'listening',label:'Listening',score:listening.accuracy,evidence:listening.count,target:12},
    {id:'conversation',label:'Conversation',score:conversation.accuracy,evidence:conversation.count,target:12},
    {id:'writing',label:'Writing practice',score:Math.min(1,writingCount/6),evidence:writingCount,target:6,note:'Completion only; local mode cannot grade writing accurately.'}
  ].map(d=>({...d,qualityPct:Math.round(d.score*100),evidencePct:Math.round(Math.min(1,d.evidence/d.target)*100)}));
  const evidenceMean=domains.reduce((a,d)=>a+d.evidencePct,0)/domains.length/100;
  const qualityDomains=domains.filter(d=>d.evidence>0);
  const quality=qualityDomains.length?qualityDomains.reduce((a,d)=>a+d.score,0)/qualityDomains.length:0;
  const readiness=Math.round(100*quality*Math.sqrt(evidenceMean));
  const confidence=evidenceMean>=.75?'moderate':evidenceMean>=.4?'developing':'low';
  const weakest=[...domains].sort((a,b)=>(a.qualityPct*a.evidencePct)-(b.qualityPct*b.evidencePct)).slice(0,3);
  return {domains,readiness,confidence,evidencePct:Math.round(evidenceMean*100),weakest};
}
function resolveOneMistake(concepts=[]){
  const open=state.mistakes.filter(m=>!m.resolved&&concepts.some(c=>(m.concepts||[m.concept]).includes(c))).sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
  if(!open.length)return null;
  const m={...open[0],resolved:true,resolvedAt:nowISO()};
  return put('mistakes',m);
}

function buildDailyPlan(minutes){
  const due=dueCards().length; const weak=weaknesses(); const studied=studiedTopicIds(); const a2=a2Model();
  const slots=Math.max(2,Math.round(minutes/4)); const tasks=[];
  if(due) tasks.push({type:'vocab',title:`Review ${Math.min(due,Math.max(3,slots*2))} due cards`,why:'Due retrieval gets priority because delayed recall is the core retention signal.'});
  if(weak.length) tasks.push({type:'grammar',topic:weak[0].id,title:`Repair: ${weak[0].label}`,why:'This concept has produced recent errors.'});
  const eligible=GRAMMAR_EXERCISES.filter(g=>g.topics.some(t=>studied.includes(t)));
  if(eligible.length) tasks.push({type:'grammar',title:'Mixed grammar retrieval',why:'Interleaves already encountered material instead of blocking one rule.'});
  if(minutes>=10) tasks.push({type:'reading',title:'Short reading / listening',why:`Builds comprehension evidence toward A2${a2.weakest.some(x=>x.id==='reading'||x.id==='listening')?' — currently one of your weaker evidence areas':''}.`});
  if(minutes>=15) tasks.push({type:'conversation',title:'One practical exchange',why:`Builds spontaneous output toward A2${a2.weakest.some(x=>x.id==='conversation')?' — currently a priority area':''}.`});
  if(minutes>=20 && weak[1]) tasks.push({type:'grammar',topic:weak[1].id,title:`Second repair: ${weak[1].label}`,why:'Extra time is used for demonstrated weaknesses, not filler.'});
  return tasks.slice(0,Math.max(2,slots));
}

function availableGrammar(){
  let pool=[...GRAMMAR_EXERCISES];
  if(state.grammarFilter!=='all') pool=pool.filter(g=>g.topics.includes(state.grammarFilter));
  const studied=studiedTopicIds(); const matched=pool.filter(g=>g.topics.some(t=>studied.includes(t)));
  return matched.length?matched:pool;
}

  const input=document.querySelector('#grammarInput'); input.onkeydown=e=>{if(e.key==='Enter')checkGrammar(ex,input.value)};

  document.querySelector('#skipGrammar').onclick=()=>{state.grammarIndex=(state.grammarIndex+1)%pool.length;renderGrammar();};
}

async function checkGrammar(ex,input){
  if(!input.trim()) return; const result=evaluateExercise(ex,input); const dHint=diacriticHint(input,ex.accepted[0]);
  const fb=document.querySelector('#grammarFeedback');
  if(result.correct){
    fb.innerHTML=`<div class="feedback good"><strong>Correct.</strong><div>${escapeHtml(ex.explanation)}</div></div><div class="row" style="margin-top:10px"><button class="btn" id="nextGrammar">Next question</button><button class="btn ghost" id="whyGrammar">Why is this correct?</button></div>`;
    await logActivity({type:'grammar',exerciseId:ex.id,concepts:ex.topics,correct:true,mode:ex.type,confidence:state.grammarConfidence}); await resolveOneMistake(ex.topics); await refresh();
    document.querySelector('#nextGrammar').onclick=()=>{state.grammarIndex=(state.grammarIndex+1)%availableGrammar().length;renderGrammar()};
    document.querySelector('#whyGrammar').onclick=()=>toast(ex.explanation);
  } else {
    const clue=dHint?`<div><strong>Close:</strong> ${escapeHtml(dHint)}</div>`:'';
    fb.innerHTML=`<div class="feedback bad"><strong>Not quite.</strong>${clue}<div style="margin-top:6px">Correct answer: <strong>${escapeHtml(ex.answer)}</strong></div><div class="small muted" style="margin-top:7px">${escapeHtml(ex.explanation)}</div></div><div class="row" style="margin-top:10px"><button class="btn primary" id="retryGrammar">Retry from memory</button><button class="btn" id="whyWrong">Why is this wrong?</button></div>`;
    await logMistake({concept:ex.topics[0],concepts:ex.topics,exerciseType:ex.type,prompt:ex.prompt,userAnswer:input,correctAnswer:ex.answer,explanation:ex.explanation});
    await logActivity({type:'grammar',exerciseId:ex.id,concepts:ex.topics,correct:false,mode:ex.type,confidence:state.grammarConfidence}); await refresh();
    document.querySelector('#retryGrammar').onclick=()=>{document.querySelector('#grammarInput').value='';document.querySelector('#grammarInput').focus();fb.innerHTML=''};
    document.querySelector('#whyWrong').onclick=()=>{fb.querySelector('.feedback').innerHTML+=`<div class="notice" style="margin-top:10px">${escapeHtml(ex.explanation)}</div>`};
  }
}

async function revealVocab(input){ state.currentInput=input; state.revealCard=true; renderVocab(); }
async function rateVocab(card,rating){
  const item=state.vocab.find(v=>v.id===card.vocabId); const production=card.direction==='en-pl';
  const expected=production?item.lemma:item.meaning.split('/')[0].trim(); const selfCorrect=normalize(state.currentInput)===normalize(expected);
  const previous={...card.schedule}; card.schedule=scheduleReview(card.schedule,rating); await put('cards',card);
  await put('reviews',{id:uid('rev'),cardId:card.id,vocabId:item.id,direction:card.direction,rating,reviewedAt:nowISO(),previousDue:previous.due,nextDue:card.schedule.due,typedAnswer:state.currentInput});
  await logActivity({type:'vocab',vocabId:item.id,mode:production?'production':'recognition',correct:rating!=='again',typedExact:selfCorrect});
  if(rating==='again') await logMistake({concept:`vocab:${item.id}`,exerciseType:production?'production':'recognition',prompt:production?item.meaning:item.lemma,userAnswer:state.currentInput,correctAnswer:expected,explanation:`Review the lemma and its context: ${item.example}`});
  await refresh(); state.vocabPos+=1; state.revealCard=false;state.currentInput=''; if(state.vocabPos>=state.vocabQueue.length) buildVocabQueue(); renderVocab();
}

async function addVocab(){
  const lemma=document.querySelector('#newLemma').value.trim(), meaning=document.querySelector('#newMeaning').value.trim(); if(!lemma||!meaning)return toast('Add both lemma and meaning.');
  const id=uid('v'); const v={id,lemma,meaning,gender:document.querySelector('#newGender').value.trim()||'unspecified',forms:document.querySelector('#newForms').value.trim()||'—',example:'',tags:['manual']};
  await put('vocab',v); for(const direction of ['pl-en','en-pl'])await put('cards',{id:`${id}:${direction}`,vocabId:id,direction,schedule:newSchedule(),createdAt:nowISO()}); await refresh(); buildVocabQueue();renderVocab();
}

function renderConversation(){
  const sc=CONVERSATION_SCENARIOS.find(s=>s.id===state.conversation.scenario); const c=state.conversation;
  if(!c.messages.length) c.messages=[{from:'npc',text:sc.turns[0].npc}]; const turn=sc.turns[Math.min(c.turn,sc.turns.length-1)]; const done=c.turn>=sc.turns.length;
  view(`${titleBlock('Meaningful output','Conversation practice','Corrections are delayed until the exchange ends so fluency is not interrupted.')}
    <div class="grid"><section class="card full"><div class="row space"><div class="seg" id="convMode">${['guided','standard','immersion'].map(m=>`<button data-mode="${m}" class="${c.mode===m?'active':''}">${m}</button>`).join('')}</div><span class="pill">A1 · Restaurant</span></div></section>
    <section class="card wide"><div class="conversation">${c.messages.map(m=>`<div class="bubble ${m.from==='user'?'user':''}">${escapeHtml(m.text)}</div>`).join('')}</div>
      ${done?`<div class="feedback good" style="margin-top:14px"><strong>Exchange complete.</strong><div class="small">${conversationFeedback(sc,c.responses)}</div></div><button class="btn" id="restartConv" style="margin-top:10px">Try again</button>`:`${c.mode==='guided'?`<div class="row" style="margin-top:14px">${turn.suggestions.map(s=>`<button class="btn ghost suggestion">${escapeHtml(s)}</button>`).join('')}</div>`:''}<div class="field" style="margin-top:12px"><input id="convInput" placeholder="Reply in Polish…"></div><button class="btn primary" id="sendConv" style="margin-top:10px">Send</button>`}
    </section><section class="card"><h2>Mode</h2><p class="muted small">Guided shows response support. Standard keeps hints optional. Immersion keeps the exchange Polish-only.</p>${c.mode!=='immersion'&&!done?`<button class="btn" id="convHint">Hint</button><div id="convHintBox" class="small muted" style="margin-top:8px"></div>`:''}</section></div>`);
  document.querySelectorAll('#convMode button').forEach(b=>b.onclick=()=>{c.mode=b.dataset.mode;renderConversation()});
  if(done){document.querySelector('#restartConv').onclick=()=>{state.conversation={scenario:'restaurant',mode:c.mode,turn:0,messages:[],responses:[]};renderConversation()};return;}
  document.querySelectorAll('.suggestion').forEach(b=>b.onclick=()=>{document.querySelector('#convInput').value=b.textContent;document.querySelector('#convInput').focus()});
  const input=document.querySelector('#convInput'); input.onkeydown=e=>{if(e.key==='Enter')sendConversation(sc,input.value)}; document.querySelector('#sendConv').onclick=()=>sendConversation(sc,input.value);
  const hint=document.querySelector('#convHint'); if(hint)hint.onclick=()=>document.querySelector('#convHintBox').textContent=`Useful language: ${turn.suggestions.join(' / ')}`;
}

async function sendConversation(sc,text){
  if(!text.trim())return; const c=state.conversation; const turn=sc.turns[c.turn]; c.responses.push(text.trim()); c.messages.push({from:'user',text:text.trim()}); c.turn+=1;
  const match=turn.keywords.some(k=>normalize(text).includes(normalize(k))); await logActivity({type:'conversation',scenario:sc.id,turn:c.turn,correct:match});
  if(c.turn<sc.turns.length)c.messages.push({from:'npc',text:sc.turns[c.turn].npc}); await refresh();renderConversation();
}
function conversationFeedback(sc,responses){
  const misses=responses.map((r,i)=>({r,i,ok:sc.turns[i]?.keywords.some(k=>normalize(r).includes(normalize(k)))})).filter(x=>!x.ok);
  if(!misses.length)return 'Your responses used the expected communicative language for this scripted scenario. This is a limited local check, not a full grammatical evaluation.';
  return `The local checker could not confidently validate ${misses.length} response${misses.length===1?'':'s'}. That does not automatically mean they were wrong; without an AI or full parser, open-ended Polish is intentionally judged conservatively.`;
}

function tokenize(text){ return text.split(/(\s+|[.,!?])/).map(tok=>{const key=normalize(tok);return LEXICON[key]?`<button class="word" data-word="${escapeHtml(key)}">${escapeHtml(tok)}</button>`:escapeHtml(tok)}).join(''); }
function renderReading(){
  const r=READINGS[state.readingIndex%READINGS.length];
  view(`${titleBlock('Comprehensible input','Reading & listening','Listen before revealing the transcript, or read and inspect selected words in context.')}
  <div class="grid"><section class="card wide"><div class="row space"><span class="pill">${escapeHtml(r.level)}</span><div class="row"><button class="btn" id="speakNormal">▶ Normal</button><button class="btn" id="speakSlow">▶ Slow</button></div></div><h2>${escapeHtml(r.title)}</h2><div id="transcript" class="prompt" hidden>${tokenize(r.text)}</div><button class="btn primary" id="showTranscript">Reveal transcript</button><div id="wordInfo" class="notice" style="margin-top:12px">Click an underlined word after revealing the transcript.</div></section>
  <section class="card"><h2>Comprehension</h2><div class="stack">${r.questions.map((q,i)=>`<div class="field"><label>${i+1}. ${escapeHtml(q.q)}</label><input data-rq="${i}"><div id="rqf${i}" class="small"></div></div>`).join('')}<button class="btn" id="checkReading">Check understanding</button></div></section>
  <section class="card full"><button class="btn ghost" id="nextReading">Another passage</button><div class="notice" style="margin-top:10px">Audio uses your browser/device Polish text-to-speech voice. It is for listening input only; PolskiLab does not claim synthetic speech can assess pronunciation.</div></section></div>`);
  document.querySelector('#showTranscript').onclick=()=>{state.transcriptRevealed=true;document.querySelector('#transcript').hidden=false;document.querySelector('#showTranscript').hidden=true;bindWords()};
  document.querySelector('#speakNormal').onclick=()=>speakPolish(r.text,.95); document.querySelector('#speakSlow').onclick=()=>speakPolish(r.text,.67);
  document.querySelector('#checkReading').onclick=async()=>{for(let i=0;i<r.questions.length;i++){const inp=document.querySelector(`[data-rq="${i}"]`);const ok=r.questions[i].accepted.map(normalize).includes(normalize(inp.value));document.querySelector(`#rqf${i}`).textContent=ok?'Correct.':`Answer: ${r.questions[i].answer}`;document.querySelector(`#rqf${i}`).className=`small ${ok?'':'danger'}`;await logActivity({type:state.transcriptRevealed?'reading':'listening',passageId:r.id,question:i,correct:ok})}await refresh()};
  document.querySelector('#nextReading').onclick=()=>{state.readingIndex=(state.readingIndex+1)%READINGS.length;state.transcriptRevealed=false;renderReading()};
}
function bindWords(){document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{const [lemma,meaning,role]=LEXICON[b.dataset.word];document.querySelector('#wordInfo').innerHTML=`<strong>${escapeHtml(b.textContent)}</strong> → <strong>${escapeHtml(lemma)}</strong> · ${escapeHtml(meaning)}<br><span class="small">${escapeHtml(role)}</span>`})}
function speakPolish(text,rate){ if(!('speechSynthesis'in window))return toast('Speech synthesis is not supported in this browser.');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='pl-PL';u.rate=rate;const voice=speechSynthesis.getVoices().find(v=>v.lang?.toLowerCase().startsWith('pl'));if(voice)u.voice=voice;speechSynthesis.speak(u); }

function renderWriting(){
  const prompts=['Describe your morning in 5–7 sentences.','Write a short message to a friend about your weekend.','Give your opinion: Is living in a big city better than a small town?'];
  view(`${titleBlock('Deliberate output','Writing workshop','Draft locally. The free baseline saves your work and runs transparent surface checks; deep four-category language feedback needs an optional AI service.')}
  <div class="grid"><section class="card wide"><div class="field"><label>Task</label><select id="writePrompt">${prompts.map(p=>`<option>${escapeHtml(p)}</option>`).join('')}</select></div><div class="field" style="margin-top:10px"><label>Your Polish</label><textarea id="writeText" placeholder="Napisz tutaj…"></textarea></div><div class="row"><button class="btn primary" id="saveWriting">Save draft</button><button class="btn" id="localWritingFeedback">Run free local checks</button></div><div id="writeFeedback" style="margin-top:12px"></div></section>
  <section class="card"><h2>Feedback capability</h2><div class="list"><div class="list-item"><strong>Free, local</strong><br><span class="small muted">Saving, length, sentence boundaries, obvious spacing, diacritic presence, recurring-error prompts.</span></div><div class="list-item"><strong>Optional AI</strong><br><span class="small muted">Grammar, vocabulary choice, naturalness and clarity across open-ended writing. No API key is embedded.</span></div></div></section>
  <section class="card full"><h2>Saved drafts</h2>${state.writing.length?`<div class="list">${state.writing.slice(-5).reverse().map(w=>`<div class="list-item"><strong>${escapeHtml(w.prompt)}</strong><div class="small muted">${new Date(w.createdAt).toLocaleString()} · ${w.text.split(/\s+/).filter(Boolean).length} words</div></div>`).join('')}</div>`:'<p class="muted small">No drafts saved yet.</p>'}</section></div>`);
  document.querySelector('#saveWriting').onclick=async()=>{const text=document.querySelector('#writeText').value.trim();if(!text)return;await put('writing',{id:uid('write'),prompt:document.querySelector('#writePrompt').value,text,createdAt:nowISO()});await logActivity({type:'writing',wordCount:text.split(/\s+/).filter(Boolean).length});await refresh();toast('Draft saved locally.');renderWriting()};
  document.querySelector('#localWritingFeedback').onclick=()=>{const t=document.querySelector('#writeText').value.trim(); const msgs=[]; if(t.length<30)msgs.push('Write a little more before evaluating the piece.');if(t&&!/[.!?]$/.test(t))msgs.push('Your final sentence may be missing end punctuation.');if(/\s{2,}/.test(t))msgs.push('There are repeated spaces to clean up.');if(t&&!/[ąćęłńóśźż]/i.test(t))msgs.push('No Polish diacritics appear. That can be valid, but check whether any are missing.');if(!msgs.length)msgs.push('No simple surface issues detected. This local check cannot reliably judge Polish grammar or naturalness.');document.querySelector('#writeFeedback').innerHTML=`<div class="feedback">${msgs.map(m=>`<div>• ${escapeHtml(m)}</div>`).join('')}</div>`};
}

function weaknesses(){
  const map=new Map(); for(const m of state.mistakes.filter(m=>!m.resolved)){const id=m.concept||m.concepts?.[0]||'other'; const cur=map.get(id)||{id,label:id.startsWith('vocab:')?(state.vocab.find(v=>v.id===id.split(':')[1])?.lemma||'Vocabulary item'):topicName(id),count:0};cur.count++;map.set(id,cur)} return [...map.values()].sort((a,b)=>b.count-a.count);
}
function renderProgress(){
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));const acts=state.activity.filter(a=>new Date(a.at).toDateString()===d.toDateString());return {label:d.toLocaleDateString('en',{weekday:'short'}),count:acts.length}}); const max=Math.max(1,...days.map(d=>d.count));
  const prod=state.activity.filter(a=>a.type==='vocab'&&a.mode==='production');const rec=state.activity.filter(a=>a.type==='vocab'&&a.mode==='recognition'); const a2=a2Model();
  const confidenceActs=state.activity.filter(a=>a.type==='grammar'&&a.confidence); const sure=confidenceActs.filter(a=>a.confidence==='sure'); const sureWrong=sure.filter(a=>a.correct===false).length;
  view(`${titleBlock('A2 goal','Progress toward practical A2','PolskiLab estimates readiness from your own delayed retrieval and skill evidence. It does not award or certify CEFR levels.')}
  <div class="grid">
    <section class="card wide"><div class="row space"><div><div class="kicker">Estimated A2 readiness</div><div class="metric">${a2.readiness}%</div></div><span class="pill">${a2.confidence} confidence · ${a2.evidencePct}% evidence coverage</span></div><div class="progress" style="margin:12px 0"><span style="width:${a2.readiness}%"></span></div><p class="small muted">The estimate is deliberately penalised when there is little evidence. A high short-term accuracy score alone will not make the A2 estimate jump to 100%.</p></section>
    <section class="card"><div class="kicker">Production reviews</div><div class="metric">${prod.length}</div><p class="small muted">English → Polish</p></section>
    <section class="card"><div class="kicker">Recognition reviews</div><div class="metric">${rec.length}</div><p class="small muted">Polish → English</p></section>
    <section class="card full"><h2>A2 skill evidence</h2><div class="skill-grid">${a2.domains.map(d=>`<div class="list-item"><div class="row space"><strong>${escapeHtml(d.label)}</strong><span class="small">${d.evidence?d.qualityPct+'%':'—'}</span></div><div class="progress" style="margin:8px 0"><span style="width:${d.evidence?d.qualityPct:0}%"></span></div><div class="small muted">${d.evidence} / ${d.target} evidence target · ${d.evidencePct}% coverage${d.note?`<br>${escapeHtml(d.note)}`:''}</div></div>`).join('')}</div></section>
    <section class="card wide"><h2>Practice activity · 7 days</h2><div class="chart-bars">${days.map(d=>`<div class="bar" title="${d.label}: ${d.count}" style="height:${Math.max(3,d.count/max*100)}%"></div>`).join('')}</div><div class="row space small muted">${days.map(d=>`<span>${d.label}</span>`).join('')}</div></section>
    <section class="card"><h2>Weaknesses</h2>${weaknesses().length?weaknesses().slice(0,6).map(w=>`<div class="list-item" style="margin-bottom:7px"><strong>${escapeHtml(w.label)}</strong><div class="small muted">${w.count} open error${w.count===1?'':'s'}</div></div>`).join(''):'<p class="muted small">No open error history yet.</p>'}</section>
    <section class="card"><h2>Calibration</h2><div class="metric">${sure.length?Math.round((sure.length-sureWrong)/sure.length*100)+'%':'—'}</div><p class="small muted">Accuracy when you said you were sure. Confident mistakes are especially useful targets for review.</p></section>
    <section class="card full"><h2>What “A2 readiness” means here</h2><p class="muted">The book records what you have encountered; this page tracks what you can retrieve and understand later. The estimate should become more trustworthy only as you accumulate evidence across grammar, vocabulary production, reading, listening, conversation and writing. It is a learning signal, not an official exam result.</p></section>
  </div>`);
}

function renderTextbook(){
  view(`${titleBlock('Polski, krok po kroku → A2','Textbook companion','Use the book to tell PolskiLab what you have encountered. Your performance — not the chapter number — determines what is treated as learned.')}
  <div class="grid">
    <section class="card full"><div class="notice"><strong>How the link works:</strong> add the objectives you actually studied in the book, assign an A2 skill area, and mark their status. PolskiLab then allows those concepts into adaptive practice without pretending the textbook chapter itself proves mastery.</div></section>
    <section class="card full"><h2>Add a studied objective</h2><div class="topic-row"><input id="topicTitle" placeholder="e.g. Genitive after szukać"><select id="topicCategory"><option>Grammar</option><option>Vocabulary</option><option>Communication</option></select><input id="topicVolume" placeholder="Volume (optional)"><input id="topicLesson" placeholder="Lesson/chapter"><button class="btn primary" id="addTopic">Add</button></div><div class="row" style="margin-top:10px"><div class="field" style="min-width:210px"><label>A2 skill area</label><select id="topicDomain"><option value="grammar">Grammar</option><option value="vocab">Vocabulary</option><option value="conversation">Conversation</option><option value="reading">Reading</option><option value="listening">Listening</option><option value="writing">Writing</option></select></div><div class="field" style="flex:1"><label>Your notes / examples</label><textarea id="topicNotes" placeholder="What did you learn or practise? Do not paste copyrighted textbook pages."></textarea></div></div></section>
    <section class="card full"><h2>Your concept record</h2><div class="stack">${state.topics.map(t=>`<div class="list-item topic-row" data-topic="${t.id}"><div><strong>${escapeHtml(t.title)}</strong><div class="small muted">${escapeHtml(t.category)}${t.volume?` · Vol. ${escapeHtml(t.volume)}`:''}${t.lesson?` · ${escapeHtml(t.lesson)}`:''}<br>A2: ${escapeHtml(t.a2Domain||String(t.category||'').toLowerCase())}</div></div><select data-status="${t.id}"><option value="not_studied" ${t.status==='not_studied'?'selected':''}>Not yet</option><option value="in_progress" ${t.status==='in_progress'?'selected':''}>In progress</option><option value="studied" ${t.status==='studied'?'selected':''}>Studied</option></select><span class="small muted">${escapeHtml(t.notes||'No notes')}</span><span class="small muted">${escapeHtml(t.source||'manual')}</span><button class="btn ghost danger" data-delete-topic="${t.id}">Remove</button></div>`).join('')}</div></section>
  </div>`);
  document.querySelector('#addTopic').onclick=async()=>{const title=document.querySelector('#topicTitle').value.trim();if(!title)return;const id=uid('topic');await put('topics',{id,title,category:document.querySelector('#topicCategory').value,a2Domain:document.querySelector('#topicDomain').value,status:'in_progress',volume:document.querySelector('#topicVolume').value.trim(),lesson:document.querySelector('#topicLesson').value.trim(),notes:document.querySelector('#topicNotes').value.trim(),source:'manual textbook objective',updatedAt:nowISO()});await refresh();renderTextbook()};
  document.querySelectorAll('[data-status]').forEach(s=>s.onchange=async()=>{const t=state.topics.find(x=>x.id===s.dataset.status);t.status=s.value;t.updatedAt=nowISO();await put('topics',t);await refresh();toast('Topic status saved.')});
  document.querySelectorAll('[data-delete-topic]').forEach(b=>b.onclick=async()=>{if(confirm('Remove this topic from your concept record?')){await remove('topics',b.dataset.deleteTopic);await refresh();renderTextbook()}});
}

function showDataDialog(){
  const modal=document.createElement('div');Object.assign(modal.style,{position:'fixed',inset:0,background:'rgba(0,0,0,.5)',zIndex:80,display:'grid',placeItems:'center',padding:'20px'});modal.innerHTML=`<div class="card" style="max-width:520px;width:100%;grid-column:auto"><h2>Your data</h2><p class="muted">Export a JSON backup or import one. Import replaces the current local dataset.</p><div class="row"><button class="btn primary" id="exportBtn">Export JSON</button><button class="btn" id="importBtn">Import JSON</button><button class="btn ghost" id="closeData">Close</button></div></div>`;document.body.appendChild(modal);
  modal.querySelector('#closeData').onclick=()=>modal.remove();modal.onclick=e=>{if(e.target===modal)modal.remove()};
  modal.querySelector('#exportBtn').onclick=async()=>{const data=await exportData();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`polskilab-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url)};
  modal.querySelector('#importBtn').onclick=()=>{modal.remove();document.querySelector('#importFile').click()};
}
async function handleImport(e){const file=e.target.files?.[0];if(!file)return;if(!confirm('Importing will replace your current local PolskiLab data. Continue?'))return;try{const data=JSON.parse(await file.text());await importData(data);await refresh();shell();toast('Backup imported.')}catch(err){alert(`Import failed: ${err.message}`)}finally{e.target.value=''}}

async function init(){
  await seed();await refresh();const theme=state.profile?.theme||'system';document.documentElement.dataset.theme=theme==='system'?'':theme;shell();
  if('serviceWorker'in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

init().catch(err=>{document.querySelector('#app').innerHTML=`<main class="main"><div class="feedback bad"><strong>PolskiLab could not start.</strong><pre>${escapeHtml(err.stack||err.message)}</pre></div></main>`});

  </script>
</body>
